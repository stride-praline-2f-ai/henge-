name: Build DuoSDK IPA (not Henge)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'duosdk-build/**'
      - 'ci/duosdk-*.py'
      - '.github/workflows/duosdk-ipa.yml'

permissions:
  contents: read

jobs:
  build-duosdk:
    name: Compile and package DuoSDK
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Verify native iOS build tools
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          test "$(uname -m)" = "arm64"

      - name: Extract uploaded DuoSDK source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p duosdk-src
          base64 --decode -i duosdk-build/source.tar.xz.b64 > "$RUNNER_TEMP/duosdk-source.tar.xz"
          tar -xJf "$RUNNER_TEMP/duosdk-source.tar.xz" -C duosdk-src
          test -f duosdk-src/XFlagProbe.xcodeproj/project.pbxproj
          test -f duosdk-src/Sources/App.swift
          test -f duosdk-src/Sources/XFlags.m
          sips --resampleHeightWidth 1024 1024 duosdk-src/Sources/DuoSDKAssets.xcassets/AppIcon.appiconset/DuoSDK.png
          plutil -lint duosdk-src/GestaltX.entitlements
          echo "DuoSDK source archive verified. Henge source is not built."

      - name: Adapt DuoSDK for English and iOS 27.2.1
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/duosdk-adapt-2721.py duosdk-src
          grep -q 'iOS 27.2.1' duosdk-src/Sources/XCacheTransaction.m
          grep -q 'Review only' duosdk-src/Sources/App.swift
          echo "Adaptation succeeded; original cache validation and rollback checks remain in place."

      - name: Add read-only signing and cache diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/duosdk-diagnose-signing.py duosdk-src
          grep -q 'App Group unavailable' duosdk-src/Sources/XCacheTransaction.m
          echo "Detailed error messages compiled in; existing system-cache checks unchanged."

      - name: Resolve effective signed App Groups safely
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/duosdk-select-signed-group.py duosdk-src
          grep -q 'SecTaskCopyValueForEntitlement' duosdk-src/Sources/XCacheTransaction.m
          grep -q 'DuoSDKCacheSafety' duosdk-src/Sources/XCacheTransaction.m
          if grep -R -F 'group.dev.aritzmendez.gestaltx' duosdk-src/Sources duosdk-src/GestaltX.entitlements; then
            echo "Found obsolete hardcoded developer group"; exit 1
          fi
          plutil -lint duosdk-src/GestaltX.entitlements
          echo "No user provisioning values or group IDs committed."

      - name: Guard cache operations and run static preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/duosdk-adapt-2721.py ci/duosdk-diagnose-signing.py ci/duosdk-select-signed-group.py ci/duosdk-guard-cache.py
          python3 ci/duosdk-guard-cache.py duosdk-src
          grep -q 'rmdir(caches.fileSystemRepresentation)' duosdk-src/Sources/worse_query.m
          grep -q 'DuoSDKLastCacheError' duosdk-src/Sources/XCacheTransaction.m
          if grep -F 'removeItemAtPath: caches' duosdk-src/Sources/worse_query.m; then
            echo "Unsafe recursive App Group cache removal remains"; exit 1
          fi
          echo "App Group cache safety preflight passed."

      - name: Explain LaunchServices layout rejection without modifying validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/duosdk-layout-report.py
          python3 ci/duosdk-layout-report.py duosdk-src
          grep -q 'DuoSDKPlanLayoutReport' duosdk-src/Sources/DuoSDKPlan.m
          grep -q 'Read-only layout diagnosis' duosdk-src/Sources/XCacheTransaction.m
          echo "Additional read-only cache layout diagnostics enabled."

      - name: Add sideloaded app review and per-app selection
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/duosdk-app-selection.py
          python3 ci/duosdk-app-selection.py duosdk-src
          grep -q 'DUOSDK_SELECTION_DATA' duosdk-src/Sources/XCacheTransaction.m
          grep -q 'selectedIDs.isEmpty' duosdk-src/Sources/App.swift
          grep -q 'selectedIDsJSON' duosdk-src/Sources/Bridge.h
          grep -q 'Selected apps no longer qualify' duosdk-src/Sources/XCacheTransaction.m
          grep -q 'Other signing (possibly sideloaded)' duosdk-src/Sources/DuoSDKPlan.m
          echo "Read-only review and explicit selected-ID transaction gating verified."

      - name: Add per-app restore history and prioritize older SDKs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/duosdk-restore-history.py
          python3 ci/duosdk-restore-history.py duosdk-src
          grep -q 'DuoSDKPlanAll' duosdk-src/Sources/DuoSDKPlan.m
          grep -q 'DUOSDK_RESTORE_DATA' duosdk-src/Sources/XCacheTransaction.m
          grep -q 'batch-upgrade-reverse' duosdk-src/Sources/XCacheTransaction.m
          grep -q 'SDK below 27.1' duosdk-src/Sources/App.swift
          grep -q 'Choose apps to restore' duosdk-src/Sources/App.swift
          echo "Per-app history and SDK grouping patch passed its static checks."

      - name: Add DuoSDK v2 searchable app workspace and saved targets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/duosdk-workspace-v2.py
          python3 ci/duosdk-workspace-v2.py duosdk-src
          grep -q 'savedTargets' duosdk-src/Sources/App.swift
          grep -q 'DuoSDKPlanAll(original' duosdk-src/Sources/XCacheTransaction.m
          grep -q 'Saved adjustments needing review' duosdk-src/Sources/App.swift
          grep -q 'configurable' duosdk-src/Sources/XCacheTransaction.m
          echo "User-opt-in SDK target and saved preference patch passed its static checks."

      - name: Add foreground heartbeat and safe local journal self-repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/duosdk-heartbeat-repair.py
          python3 ci/duosdk-heartbeat-repair.py duosdk-src
          grep -q 'duoHeartbeatAndRepair' duosdk-src/Sources/XCacheTransaction.m
          grep -q 'DuoSDKMaintenanceForSelectionInternal' duosdk-src/Sources/XCacheTransaction.m
          grep -q 'RecoveryJournalArchives' duosdk-src/Sources/XCacheTransaction.m
          grep -q 'Run heartbeat and self-repair' duosdk-src/Sources/App.swift
          echo "Heartbeat journal repair and serialized transaction gate validated."

      - name: Add fold transition and rotation state diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/duosdk-orientation-diagnostics.py
          python3 ci/duosdk-orientation-diagnostics.py duosdk-src
          grep -q 'Fold and rotation diagnostics' duosdk-src/Sources/App.swift
          grep -q 'sampleSelfScene' duosdk-src/Sources/App.swift
          grep -q 'duosdk.layoutTrials.v1' duosdk-src/Sources/App.swift
          echo "Read-only rotation diagnostics patched; cache writer unchanged."

      - name: Add verified installed SDK stability recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/duosdk-verified-sdk-recovery.py
          python3 ci/duosdk-verified-sdk-recovery.py duosdk-src
          grep -q 'duoInstalledSDKForRow' duosdk-src/Sources/XCacheTransaction.m
          grep -q 'recoverFromExecutable' duosdk-src/Sources/XCacheTransaction.m
          grep -q 'Stabilise selected' duosdk-src/Sources/App.swift
          echo "Source-verified SDK restore patch installed."

      - name: Compact DuoSDK UI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/duosdk-compact-ui.py
          python3 ci/duosdk-compact-ui.py duosdk-src
          grep -q 'Advanced & diagnostics' duosdk-src/Sources/App.swift
          grep -q 'Undo recorded changes' duosdk-src/Sources/App.swift
          grep -q 'compactAppRow' duosdk-src/Sources/App.swift
          if grep -q 'Stabilise selected:' duosdk-src/Sources/App.swift; then
            echo "Experimental failing recovery control still shown"; exit 1
          fi
          echo "Main screen decluttered, safeguards preserved."

      - name: Build unsigned iOS app with Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -project duosdk-src/XFlagProbe.xcodeproj
          xcodebuild \
            -project duosdk-src/XFlagProbe.xcodeproj \
            -scheme XFlagProbe \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS='' \
            DEVELOPMENT_TEAM='' \
            REGISTER_APP_GROUPS=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee "$RUNNER_TEMP/duosdk-build.log"

      - name: Package and validate IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/derived-data/Build/Products/Release-iphoneos/XFlagProbe.app"
          test -f "$app/Info.plist"
          test -f "$app/XFlagProbe"
          xcrun lipo -info "$app/XFlagProbe"
          plutil -extract CFBundleIdentifier raw "$app/Info.plist"
          mkdir -p output/Payload
          ditto "$app" output/Payload/XFlagProbe.app
          ( cd output && zip -q -r -X DuoSDK-unsigned.ipa Payload )
          unzip -t output/DuoSDK-unsigned.ipa | tail -n 2
          python3 - <<'PY'
          import plistlib, zipfile
          with zipfile.ZipFile('output/DuoSDK-unsigned.ipa') as z:
              assert z.testzip() is None
              plist = plistlib.loads(z.read('Payload/XFlagProbe.app/Info.plist'))
              assert plist['CFBundleExecutable'] == 'XFlagProbe'
              assert plist['CFBundleIdentifier'] == 'dev.aritzmendez.sirireadprobe'
              assert len(z.read('Payload/XFlagProbe.app/XFlagProbe')) > 4096
              print('Verified unsigned IPA: ' + plist['CFBundleDisplayName'])
          PY

      - name: Upload DuoSDK IPA
        uses: actions/upload-artifact@v4
        with:
          name: DuoSDK-unsigned-IPA
          path: output/DuoSDK-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DuoSDK-build-logs
          path: |
            duosdk-src/*.buildlog
            derived-data/Logs/Build/**
          if-no-files-found: ignore
          retention-days: 7

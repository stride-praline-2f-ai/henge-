name: Henge engine memory and dispatch validation
'on':
  push:
    branches:
    - perf/engine-memory-dispatch
    paths:
    - henge-build/**
    - .github/workflows/henge-engine-next.yml
permissions:
  contents: read
concurrency:
  group: henge-engine-next-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        path: build-request
        persist-credentials: false
    - id: pins
      run: "python3 - <<'PYPIN'\nimport json,os\nm=json.load(open('build-request/henge-build/manifest.json'))\n\
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:\n    f.write('henge='+m['henge_sha']+'\\\
        n')\n    f.write('preview='+str(m.get('ui_preview_requested',True)).lower()+'\\\
        n')\nPYPIN"
    - uses: actions/checkout@v4
      with:
        repository: Leviidev/Henge
        ref: ${{ steps.pins.outputs.henge }}
        path: Henge
        persist-credentials: false
    - name: Reconstruct exact pinned and patched source
      run: 'set -euo pipefail

        python3 - <<''PYPATCH''

        from pathlib import Path

        import hashlib,json,subprocess

        root=Path(''build-request/henge-build'');m=json.loads((root/''manifest.json'').read_text());p=root/''henge.patch''

        assert hashlib.sha256(p.read_bytes()).hexdigest()==m[''patch_sha256'']

        subprocess.run([''git'',''-C'',''Henge'',''apply'',''--check'',str(p.resolve())],check=True)

        subprocess.run([''git'',''-C'',''Henge'',''apply'',str(p.resolve())],check=True)

        subprocess.run([''git'',''-C'',''Henge'',''add'',''-A''],check=True)

        subprocess.run([''git'',''-C'',''Henge'',''-c'',''user.name=Henge CI'',''-c'',''user.email=henge-ci@users.noreply.github.com'',''commit'',''-m'',''Apply
        pinned custom source for controller review''],check=True)

        PYPATCH

        bash build-request/henge-build/integrate-upstream.sh

        '
    - name: Native engine correctness and paired comparisons
      working-directory: Henge
      shell: bash
      run: "set -euo pipefail\nmkdir -p build\nexec > >(tee build/engine-next.log)\
        \ 2>&1\nulimit -s 65520\nxcodebuild -version\nsysctl -n machdep.cpu.brand_string\n\
        make -j4 build/test_branch_sites build/bench_branch_sites build/test_jit_retention\
        \ build/bench_jit_retention build/test_ijc_eviction build/test_register_groups\
        \ build/test_mem build/test_exc build/test_mmu build/test_jit_ring build/test_tlb_preload\
        \ build/test_tail_recheck build/bench_interleaved_groups\nbuild/test_register_groups\n\
        HV_BRANCH_SITE_HINTS=1 build/test_branch_sites\nHV_IJC_PAIR=0 build/test_branch_sites\n\
        build/test_branch_sites\nbuild/bench_branch_sites\nfor groups in 0 2; do\n\
        \ HV_GROUPS=$groups build/test_mem\n HV_GROUPS=$groups build/test_exc\ndone\n\
        build/test_mmu\nbuild/test_ijc_eviction\nbuild/test_jit_retention\nHV_TEST_JIT_SEGMENTS=4\
        \ HV_JIT_POISON=1 build/test_jit_ring\nfor round in 0 1 2; do\n if [[ \"$round\"\
        \ == 1 ]]; then policies=(0 1); else policies=(1 0); fi\n for policy in \"\
        ${policies[@]}\"; do HV_JIT_RETAIN_REFERENCE=$policy build/bench_jit_retention;\
        \ done\ndone\nHV_RETENTION_MMIO=1 HV_JIT_RETAIN_REFERENCE=1 build/bench_jit_retention\n\
        HV_RETENTION_MMIO=1 HV_JIT_RETAIN_REFERENCE=0 build/bench_jit_retention\n\
        HV_EVICT_FULL_BRANCH_RESET=1 HV_JIT_POISON=1 build/test_jit_ring\nHV_JIT_POISON=1\
        \ build/test_jit_ring\nHV_TLB_PRELOAD=1 HV_GROUPS=2 build/test_mem\nHV_TLB_PRELOAD=1\
        \ HV_GROUPS=2 build/test_exc\nbuild/test_tail_recheck\nbuild/test_tlb_preload\n\
        build/bench_interleaved_groups\nmake -j4 B=build-ref CFLAGS='-std=c11 -Wall\
        \ -Wextra -O2 -g -Icore -Ihost -Idevices -DHV_GROUP_INTERLEAVE=0' build-ref/test_register_groups\
        \ build-ref/bench_interleaved_groups\nbuild-ref/test_register_groups\nbuild-ref/bench_interleaved_groups\n"
    - name: Compile modified core for iOS
      working-directory: Henge
      shell: bash
      run: "set -euo pipefail\nfor source in core/translate.c core/mmu.c core/dispatch.c\
        \ core/machine.c host/jit_region.c; do\n xcrun --sdk iphoneos clang -arch\
        \ arm64 -miphoneos-version-min=17.0 -std=c11 -D_DARWIN_C_SOURCE -Wall -Wextra\
        \ -Icore -Ihost -Idevices -c \"$source\" -o \"build/$(basename \"$source\"\
        ).ios.o\"\ndone\nxcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0\
        \ -c host/enter.S -o build/enter.ios.o\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: engine-next-${{ github.sha }}
        path: Henge/build/engine-next.log
        retention-days: 14
        if-no-files-found: warn

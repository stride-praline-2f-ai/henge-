name: Henge engine memory and dispatch validation
'on':
  push:
    branches:
    - perf/engine-memory-dispatch
    paths:
    - henge-build/**
    - .github/workflows/henge-engine-next.yml
permissions:
  contents: read
concurrency:
  group: henge-engine-next-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        path: build-request
        persist-credentials: false
    - id: pins
      run: "python3 - <<'PYPIN'\nimport json,os\nm=json.load(open('build-request/henge-build/manifest.json'))\n\
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:\n    f.write('henge='+m['henge_sha']+'\\\
        n')\n    f.write('preview='+str(m.get('ui_preview_requested',True)).lower()+'\\\
        n')\nPYPIN"
    - uses: actions/checkout@v4
      with:
        repository: Leviidev/Henge
        ref: ${{ steps.pins.outputs.henge }}
        path: Henge
        persist-credentials: false
    - name: Reconstruct exact pinned and patched source
      run: 'set -euo pipefail

        python3 - <<''PYPATCH''

        from pathlib import Path

        import hashlib,json,subprocess

        root=Path(''build-request/henge-build'');m=json.loads((root/''manifest.json'').read_text());p=root/''henge.patch''

        assert hashlib.sha256(p.read_bytes()).hexdigest()==m[''patch_sha256'']

        subprocess.run([''git'',''-C'',''Henge'',''apply'',''--check'',str(p.resolve())],check=True)

        subprocess.run([''git'',''-C'',''Henge'',''apply'',str(p.resolve())],check=True)

        subprocess.run([''git'',''-C'',''Henge'',''add'',''-A''],check=True)

        subprocess.run([''git'',''-C'',''Henge'',''-c'',''user.name=Henge CI'',''-c'',''user.email=henge-ci@users.noreply.github.com'',''commit'',''-m'',''Apply
        pinned custom source for controller review''],check=True)

        PYPATCH

        bash build-request/henge-build/integrate-upstream.sh

        '
    - name: Native engine correctness and paired comparisons
      working-directory: Henge
      shell: bash
      run: "set -euo pipefail\nmkdir -p build\nexec > >(tee build/engine-next.log)\
        \ 2>&1\nulimit -s 65520\nxcodebuild -version\nsysctl -n machdep.cpu.brand_string\n\
        make -j4 build/test_branch_sites build/bench_branch_sites build/test_jit_retention\
        \ build/bench_jit_retention build/test_ijc_eviction build/test_register_groups\
        \ build/test_mem build/test_exc build/test_mmu build/test_jit_ring build/test_tlb_preload\
        \ build/test_tail_recheck build/bench_interleaved_groups\nbuild/test_register_groups\n\
        HV_BRANCH_SITE_HINTS=1 build/test_branch_sites\nHV_IJC_PAIR=1 build/test_branch_sites\n\
        build/test_branch_sites\nbuild/bench_branch_sites\nfor groups in 0 2; do\n\
        \ HV_GROUPS=$groups build/test_mem\n HV_GROUPS=$groups build/test_exc\ndone\n\
        build/test_mmu\nHV_IJC_PAIR=1 build/test_mem\nHV_IJC_PAIR=1 build/test_exc\n\
        build/test_ijc_eviction\nbuild/test_jit_retention\nHV_TEST_JIT_SEGMENTS=4\
        \ HV_JIT_POISON=1 build/test_jit_ring\nfor round in 0 1 2; do\n if [[ \"$round\"\
        \ == 1 ]]; then policies=(0 1); else policies=(1 0); fi\n for policy in \"\
        ${policies[@]}\"; do HV_JIT_RETAIN_REFERENCE=$policy build/bench_jit_retention;\
        \ done\ndone\nHV_RETENTION_MMIO=1 HV_JIT_RETAIN_REFERENCE=1 build/bench_jit_retention\n\
        HV_RETENTION_MMIO=1 HV_JIT_RETAIN_REFERENCE=0 build/bench_jit_retention\n\
        HV_EVICT_FULL_BRANCH_RESET=1 HV_JIT_POISON=1 build/test_jit_ring\nHV_JIT_POISON=1\
        \ build/test_jit_ring\nHV_TLB_PRELOAD=1 HV_GROUPS=2 build/test_mem\nHV_TLB_PRELOAD=1\
        \ HV_GROUPS=2 build/test_exc\nbuild/test_tail_recheck\nbuild/test_tlb_preload\n\
        build/bench_interleaved_groups\nmake -j4 B=build-ref CFLAGS='-std=c11 -Wall\
        \ -Wextra -O2 -g -Icore -Ihost -Idevices -DHV_GROUP_INTERLEAVE=0' build-ref/test_register_groups\
        \ build-ref/bench_interleaved_groups\nbuild-ref/test_register_groups\nbuild-ref/bench_interleaved_groups\n"
    - name: Compile modified core for iOS
      working-directory: Henge
      shell: bash
      run: "set -euo pipefail\nfor source in core/translate.c core/mmu.c core/dispatch.c\
        \ core/machine.c host/jit_region.c; do\n xcrun --sdk iphoneos clang -arch\
        \ arm64 -miphoneos-version-min=17.0 -std=c11 -D_DARWIN_C_SOURCE -Wall -Wextra\
        \ -Icore -Ihost -Idevices -c \"$source\" -o \"build/$(basename \"$source\"\
        ).ios.o\"\ndone\nxcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0\
        \ -c host/enter.S -o build/enter.ios.o\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: engine-next-${{ github.sha }}
        path: Henge/build/engine-next.log
        retention-days: 14
        if-no-files-found: warn
  integration:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        path: build-request
        persist-credentials: false
    - name: Select newest installed Xcode for native touch
      run: "python3 - <<'PYSDK'\nimport glob, os, re, subprocess\nassert subprocess.check_output(['uname',\
        \ '-m'], text=True).strip() == 'arm64', 'This Henge runner requires native\
        \ arm64 macOS'\ncandidates = []\nfor app in glob.glob('/Applications/Xcode*.app'):\n\
        \    developer = app + '/Contents/Developer'\n    try:\n        version =\
        \ subprocess.check_output(['xcodebuild', '-version'], env={**os.environ, 'DEVELOPER_DIR':\
        \ developer}, text=True)\n        match = re.search(r'Xcode (\\d+(?:\\.\\\
        d+)*)', version)\n        if match: candidates.append((tuple(map(int, match[1].split('.'))),\
        \ developer, version))\n    except subprocess.CalledProcessError:\n      \
        \  pass\nif not candidates: raise SystemExit('No installed Xcode found')\n\
        _, developer, version = max(candidates)\nprint(version + developer)\nwith\
        \ open(os.environ['GITHUB_ENV'], 'a') as f: f.write('DEVELOPER_DIR=' + developer\
        \ + '\\n')\nPYSDK\n"
    - name: Load pinned inputs
      id: inputs
      run: "python3 - <<'PY'\nimport json, os\nfrom pathlib import Path\ndata = json.loads(Path('build-request/henge-build/manifest.json').read_text())\n\
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:\n    f.write('henge=' +\
        \ data['henge_sha'] + '\\n')\n    f.write('husk=' + data['husk_sha'] + '\\\
        n')\nPY\n"
    - uses: actions/checkout@v4
      with:
        repository: Leviidev/Henge
        ref: ${{ steps.inputs.outputs.henge }}
        path: Henge
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: Leviidev/Husk
        ref: ${{ steps.inputs.outputs.husk }}
        path: Husk
        persist-credentials: false
    - name: Verify and apply reviewed changes
      env:
        CUSTOM_SOURCE_COMMIT: ${{ github.sha }}
      run: "python3 - <<'PY'\nimport hashlib, json, os, plistlib, subprocess\nfrom\
        \ pathlib import Path\nfolder = Path('build-request/henge-build')\ndata =\
        \ json.loads((folder / 'manifest.json').read_text())\npatch = folder / 'henge.patch'\n\
        assert hashlib.sha256(patch.read_bytes()).hexdigest() == data['patch_sha256']\n\
        for check in (['git', '-C', 'Henge', 'apply', '--check', str(patch.resolve())],\n\
        \              ['git', '-C', 'Henge', 'apply', str(patch.resolve())]):\n \
        \   subprocess.run(check, check=True)\npath = Path('Henge/ios/Henge/Info.plist')\n\
        with path.open('rb') as f: info = plistlib.load(f)\ninfo['HengeCustomSourceCommit']\
        \ = os.environ['CUSTOM_SOURCE_COMMIT']\ninfo['HengeUpstreamCommit'] = data['henge_sha']\n\
        info['HengeCustomPullRequests'] = [14, 31, 32, 35, 36, 46, 60, 61, 63, 106]\n\
        with path.open('wb') as f: plistlib.dump(info, f)\nif os.environ.get('HENGE_GAME_MODE')\
        \ == '1':\n    subprocess.run(['python3', 'Henge/tools/configure_gaming_experiments.py',\
        \ '--info', str(path), '--game-mode'], check=True)\n# Do not silently change\
        \ normal/personal-team signing requirements.\nfor name in ['Henge.entitlements',\
        \ 'Henge.personal.entitlements']:\n    actual = Path('Henge/ios/Henge') /\
        \ name\n    expected = subprocess.check_output(['git', '-C', 'Henge', 'show',\
        \ data['henge_sha'] + ':ios/Henge/' + name])\n    assert actual.read_bytes()\
        \ == expected\nPY\ngit -C Henge add -A\ngit -C Henge -c user.name='Henge CI'\
        \ -c user.email='henge-ci@users.noreply.github.com' commit -m \"Custom Henge\
        \ 0.3 from ${GITHUB_SHA}\"\n"
    - name: Integrate pinned Henge main and reviewed device PRs
      id: integration
      run: bash build-request/henge-build/integrate-upstream.sh
    - name: Use supported macOS test-image provider cleanup
      run: 'python3 - <<''PYAPFS''

        import hashlib

        from pathlib import Path

        p=Path(''Henge/tests/test_disk_recovery_macos.py'')

        assert hashlib.sha256(p.read_bytes()).hexdigest()==''6b471d30c3cd29469c2edb1e6223e54f425037c026fb7ad3f47c16a6f9844f76'',
        ''Review APFS fixture adapter after source changes''

        s=p.read_text()

        old="        run(''hdiutil'',''detach'',''-force'',device)"

        new="        # APFS creates separate synthesized media objects. Disk Arbitration
        can\n        # retain them after volume verification even when every volume
        is cleanly\n        # unmounted. Eject those OWNED synthesized objects before
        the backing image.\n        # Each operation changes device state; no sleeps,
        skipped assertions or\n        # ignored final detach failure. Never touch
        a container with foreign stores.\n        for container in containers(device):\n            prefix=device.removeprefix(''/dev/'')+''s''\n            stores=container.get(''PhysicalStores'',[])\n            assert
        stores and all(v.get(''DeviceIdentifier'','''').startswith(prefix) for v in
        stores),container\n            reference=container[''ContainerReference'']\n            assert
        re.fullmatch(r''(?:/dev/)?disk[0-9]+'',reference),reference\n            for
        volume in container.get(''Volumes'',[]):\n                info=run(''diskutil'',''info'',''-plist'',volume[''DeviceIdentifier''],plist=True)\n                assert
        not info.get(''Mounted'') and not info.get(''MountPoint''),info\n            result=subprocess.run([''diskutil'',''eject'',''force'',reference],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=60)\n            errors.append(((''diskutil'',''eject'',''force'',reference),result.returncode,result.stderr.decode(errors=''replace'')))\n            if
        not attached():break\n        if attached():\n            # Reconfirm the
        complete current association immediately before force.\n            current=attached()\n            assert
        len(current)==1 and Path(current[0][''image-path'']).resolve()==expected_image.resolve(),current\n            for
        container in containers(device):\n                for volume in container.get(''Volumes'',[]):\n                    info=run(''diskutil'',''info'',''-plist'',volume[''DeviceIdentifier''],plist=True)\n                    assert
        not info.get(''Mounted'') and not info.get(''MountPoint''),info\n            result=subprocess.run([''diskutil'',''eject'',''force'',device],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=60)\n            if
        result.returncode:\n                print(''Provider release failed after
        owned synthesized media eject:'',attached(),containers(device),flush=True)\n                subprocess.run([''lsof'',device],stdout=sys.stderr,stderr=sys.stderr,timeout=15)\n                raise
        RuntimeError((''diskutil backing-image eject'',result.returncode,result.stdout,result.stderr))\n"

        assert s.count(old)==1

        patched=s.replace(old,new.rstrip())

        compile(patched,str(p),''exec'')

        # Keep the final assert-not-attached and every payload/Recovery/GPT/filesystem
        check.

        assert patched.count(''assert not attached(),errors'')==1

        p.write_text(patched)

        print(''PASS macOS27 fixture adapter: owned APFS synthesized media released
        before backing image; all validation retained'')

        PYAPFS

        '
    - name: Ensure Metal shader compiler
      run: "if ! xcrun --sdk macosx metal --version; then\n  xcodebuild -downloadComponent\
        \ MetalToolchain\nfi\nxcrun --sdk macosx metal --version\n"
    - name: Prepare and verify build prerequisites
      run: 'set -euo pipefail

        bash build-request/henge-build/setup-runner.sh --ci

        test -d Husk/src/app/Frameworks/StikJIT.xcframework

        test -f Husk/src/rppairing-ios/Cargo.lock

        test -f Henge/third_party/libzip/CMakeLists.txt

        df -h .


        # Native networking lifecycle tests require a macOS libslirp.

        if ! pkg-config --exists slirp; then brew install libslirp; fi

        pkg-config --cflags --libs slirp

        '
    - name: Probe public Metal archive reopening independently
      working-directory: Henge
      run: "mkdir -p build\nexec > >(tee build/archive-api-build.log) 2>&1\nxcrun\
        \ -sdk macosx metal -c tests/archive_fixture.metal -o build/archive_fixture.air\n\
        xcrun -sdk macosx metallib build/archive_fixture.air -o build/archive_fixture.metallib\n\
        xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Werror tests/test_pipeline_archive_api.m\
        \ -framework Foundation -framework Metal -o build/test_pipeline_archive_api\n\
        for name in av af anr ak ak2; do\n  xcrun -sdk macosx metal -DHENGE_ARCHIVE_FUNC_$name=1\
        \ -c tests/archive_fixture.metal -o \"build/archive_$name.air\"\n  xcrun -sdk\
        \ macosx metallib \"build/archive_$name.air\" -o \"build/archive_$name.metallib\"\
        \ndone\nset +e\nfailed=0\nfor kind in basic compute mixed separate delayed;\
        \ do\n  extra=()\n  if [[ \"$kind\" != basic ]]; then extra=(\"$kind\"); fi\n\
        \  build/test_pipeline_archive_api build/archive_fixture.metallib \"build/archive-api-$kind.bin\"\
        \ write \"${extra[@]}\" 2>&1 | tee -a build/archive-api.log\n  if [[ ${PIPESTATUS[0]}\
        \ != 0 ]]; then failed=$((failed+1)); fi\n  build/test_pipeline_archive_api\
        \ build/archive_fixture.metallib \"build/archive-api-$kind.bin\" read \"${extra[@]}\"\
        \ 2>&1 | tee -a build/archive-api.log\n  read_rc=${PIPESTATUS[0]}\n  if [[\
        \ \"$kind\" == mixed && \"$read_rc\" == 78 ]]; then\n    echo 'Mixed-container\
        \ driver limitation reproduced; production must use separate render/compute/tile\
        \ files' | tee -a build/archive-api.log\n  elif [[ ( \"$kind\" == separate\
        \ || \"$kind\" == delayed ) && \"$read_rc\" == 78 ]]; then\n    echo 'Independent\
        \ exact single-function API control proved Paravirtual missing-function behavior;\
        \ all four GPU executions and normal fallback passed; production cold-hit\
        \ requirements unchanged' | tee -a build/archive-api.log\n  elif [[ \"$read_rc\"\
        \ != 0 ]]; then failed=$((failed+1)); fi\ndone\nif [[ \"$failed\" == 0 ]];\
        \ then echo 'PASS independent Metal archives: cold render hits; compute persistence\
        \ capability checked; all four PSOs executed; fallback checked' | tee -a build/archive-api.log;\
        \ fi\nexit $((failed > 0))\n"
    - name: Retain independent Metal API result
      if: ${{ always() && !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: engine-integration-metal-api-${{ github.run_id }}
        path: 'Henge/build/archive-api.log

          Henge/build/archive-api-build.log

          '
        if-no-files-found: ignore
        retention-days: 7
    - name: Compile engine regression checks
      if: ${{ !cancelled() && steps.integration.outcome == 'success' }}
      id: native_compile
      working-directory: Henge
      run: 'set -euo pipefail

        mkdir -p build

        exec > >(tee build/validation-00.log) 2>&1

        trap ''task_rc=$?; echo "Validation failed: exit=$task_rc line=$LINENO command=$BASH_COMMAND"
        >&2'' ERR

        ulimit -s 65520

        set -x

        make -j4 build/test_register_groups build/bench_far_chain build/bench_snapshot_admission
        build/test_tlb_preload build/test_stw_flush build/test_xhci_slots build/test_inline_sysreg
        build/test_jit_region build/test_jit_ring build/test_pvg_linear_bounds build/test_mmu
        build/test_mem build/test_jit build/test_devices build/test_fastmem build/test_memory_bounds
        build/test_tail_recheck build/test_cpu_sync build/test_timer_dispatch build/test_blk_completion
        build/test_blk_segments build/test_disk_iov build/test_idle_integration


        make -j4 build/test_snapshot_pack build/test_shutdown build/test_dns_lifecycle
        build/test_vm_lifecycle build/test_pvg_lifecycle build/test_audio_lifecycle
        build/test_fastmem_bench

        '
    - name: Checked stack translations, precise exceptions and network batches
      if: ${{ !cancelled() && steps.native_compile.outcome == 'success' }}
      working-directory: Henge
      shell: bash
      run: 'set -euo pipefail

        make -j4 build/test_exc build/test_mem_register_reference build/test_exc_register_reference
        build/test_net_batch

        build/test_net_batch

        HV_GROUPS=2 build/test_mem

        HV_GROUPS=2 build/test_mem_register_reference

        build/test_exc

        build/test_exc_register_reference

        '
    - name: Validate JIT publication, MMU and superblocks
      if: ${{ !cancelled() && steps.native_compile.outcome == 'success' }}
      working-directory: Henge
      run: 'set -euo pipefail

        mkdir -p build

        exec > >(tee build/validation-01.log) 2>&1

        trap ''task_rc=$?; echo "Validation failed: exit=$task_rc line=$LINENO command=$BASH_COMMAND"
        >&2'' ERR

        ulimit -s 65520

        set -x

        build/test_register_groups

        build/bench_far_chain

        build/bench_snapshot_admission


        build/test_stw_flush

        HV_STW_IPI=1 build/test_stw_flush

        build/test_xhci_slots

        build/test_inline_sysreg

        HV_JIT_SPLIT=1 build/test_inline_sysreg

        build/test_jit_region

        build/test_jit_ring

        HV_JIT_POISON=1 build/test_jit_ring

        HV_JIT_SPLIT=1 build/test_jit_ring

        build/test_pvg_linear_bounds

        HV_JIT_RELAXED_BRANCH=1 build/test_jit_region

        build/test_mmu

        HV_WALK_LOG=0 HV_IJC_PAGES=0 build/test_mmu

        build/test_jit

        HV_SUPERBLOCKS=1 build/test_jit

        HV_SUPERBLOCKS=1 HV_JIT_SPLIT=1 build/test_jit

        '
    - name: Validate memory, timing, CPU sync and devices
      if: ${{ !cancelled() && steps.native_compile.outcome == 'success' }}
      working-directory: Henge
      run: 'set -euo pipefail

        mkdir -p build

        exec > >(tee build/validation-02.log) 2>&1

        trap ''task_rc=$?; echo "Validation failed: exit=$task_rc line=$LINENO command=$BASH_COMMAND"
        >&2'' ERR

        ulimit -s 65520

        set -x

        build/test_mem

        HV_WALK_LOG=0 HV_IJC_PAGES=0 build/test_mem

        HV_FASTMEM=1 build/test_mem


        HV_FASTMEM=1 HV_FASTMEM_ORDER=tlb-first build/test_mem


        HV_FASTMEM=1 HV_FASTMEM_ORDER=tlb-first HV_JIT_SPLIT=1 build/test_mem


        HV_FASTMEM=1 HV_FASTMEM_ORDER=tlb-first HV_TLB_PRELOAD=1 build/test_tail_recheck

        HV_SUPERBLOCKS=1 build/test_mem

        build/test_fastmem

        build/test_memory_bounds

        build/test_tail_recheck

        HV_TLB_PRELOAD=1 build/test_mem

        HV_TLB_PRELOAD=1 build/test_tail_recheck

        build/test_tlb_preload

        HV_JIT_SPLIT=1 build/test_tlb_preload


        build/test_cpu_sync

        build/test_timer_dispatch

        build/test_blk_completion


        build/test_blk_segments

        build/test_disk_iov

        build/test_idle_integration

        build/test_devices

        python3 tests/test_chain_index.py


        build/test_shutdown

        build/test_dns_lifecycle

        build/test_snapshot_pack

        build/test_vm_lifecycle

        build/test_pvg_lifecycle

        python3 tests/test_pipeline_archive.py

        build/test_audio_lifecycle

        bash tests/benchmark_fastmem.sh

        python3 tests/benchmark_surface_hash.py


        # One paired correctness/timing check of existing grouped shapes and address
        increments.

        make build/test_bench

        HV_GROUPS=0 build/test_bench > build/groups-off.log

        HV_GROUPS=1 build/test_bench > build/groups-on.log

        cat build/groups-off.log build/groups-on.log

        '
    - name: Retain early graphics failure output
      if: ${{ failure() && !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: engine-integration-early-native-validation-${{ github.run_id }}
        path: Henge/build/validation-02.log
        if-no-files-found: ignore
        retention-days: 7
    - name: Validate indexes, DNS, input and Link protocol
      if: ${{ !cancelled() && steps.integration.outcome == 'success' }}
      working-directory: Henge
      run: 'set -euo pipefail

        mkdir -p build

        exec > >(tee build/validation-03.log) 2>&1

        trap ''task_rc=$?; echo "Validation failed: exit=$task_rc line=$LINENO command=$BASH_COMMAND"
        >&2'' ERR

        ulimit -s 65520

        set -x

        python3 tests/test_translation_race.py

        python3 tests/test_walk_log.py

        python3 tests/test_hvsparse.py

        python3 tests/test_installer_preflight.py

        python3 tests/test_session_resume.py

        cc -std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -pthread
        -Itests/dns_mock -Icore -Ihost tests/test_dns_proxy.c -o build/test_dns_proxy

        build/test_dns_proxy

        swiftc ios/Henge/PhysicalMouseButtons.swift tests/test_physical_mouse_buttons.swift
        -o build/test_physical_mouse_buttons

        build/test_physical_mouse_buttons

        make test-runner

        bash tools/link/check.sh

        bash tools/check_host_scheduling.sh


        # Reproduce Xcode environment while building real macOS guest samples.

        SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" make build/tl-samples.dmg


        touch_checks=0

        bash tools/check_native_touch.sh || touch_checks=1

        python3 tests/test_disk_resize.py || touch_checks=1

        python3 tests/test_disk_recovery_macos.py || touch_checks=1

        test "$touch_checks" -eq 0

        '
    - name: Collect independent lifetime, concurrency and graphics diagnostics
      if: ${{ !cancelled() && steps.integration.outcome == 'success' }}
      working-directory: Henge
      run: 'set -euo pipefail

        mkdir -p build

        ulimit -s 65520

        bash tests/run_lifecycle_sanitizers.sh 2>&1 | tee build/validation-04.log

        '
    - name: Sanitize new engine indexes and generated paths
      working-directory: Henge
      shell: bash
      run: "set -euo pipefail\nulimit -s 65520\nflags='-std=c11 -Wall -Wextra -O1\
        \ -g -fno-omit-frame-pointer -Icore -Ihost -Idevices -fsanitize=address,undefined'\n\
        make -j4 B=build/asan ASFLAGS=-DHV_SANITIZER_HELPERS=1 CFLAGS=\"$flags\" build/asan/test_branch_sites\
        \ build/asan/test_jit_retention build/asan/test_ijc_eviction build/asan/test_exc\n\
        for binary in test_branch_sites test_jit_retention test_ijc_eviction test_exc;\
        \ do\n ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1\
        \ HV_GROUPS=2 HV_BRANCH_SITE_HINTS=1 \"build/asan/$binary\"\ndone\n"
    - name: Save validation output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: engine-integration-Henge-validation-${{ github.run_id }}
        retention-days: 7
        if-no-files-found: ignore
        path: 'Henge/build/validation-*.log

          Henge/build/scheduling-check/*.log


          Henge/build/fastmem-*.log

          Henge/build/fastmem-native-summary.json


          Henge/build/groups-*.log

          '
    - name: Fingerprint dependency toolchain
      id: toolchain
      run: "python3 - <<'PY'\nimport hashlib, os, subprocess\ncommands = [['xcodebuild',\
        \ '-version'], ['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'], ['rustc',\
        \ '-vV'], ['meson', '--version'], ['ninja', '--version'], ['pkg-config', '--version'],\
        \ ['cmake', '--version'], ['xcodegen', '--version']]\nidentity = b'\\n'.join(subprocess.check_output(c)\
        \ for c in commands)\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as f:\n\
        \    f.write('id=' + hashlib.sha256(identity).hexdigest()[:24] + '\\n')\n\
        PY\n"
      if: ${{ success() && (github.event_name == 'push' || inputs.compile_app == true
        || inputs.build_ipa == true) }}
    - name: Restore pinned dependency cache
      uses: actions/cache@v4
      with:
        path: 'Husk/third_party/build

          Husk/build/ios-arm64

          Husk/build/stamps

          '
        key: henge-cloud-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.husk
          }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('build-request/henge-build/fetch-required-sources.sh')
          }}
      if: ${{ success() && (github.event_name == 'push' || inputs.compile_app == true
        || inputs.build_ipa == true) }}
    - name: Fetch dependency sources
      working-directory: Husk
      run: bash ../build-request/henge-build/fetch-required-sources.sh "$PWD"
      if: ${{ success() && (github.event_name == 'push' || inputs.compile_app == true
        || inputs.build_ipa == true) }}
    - name: Build required iOS libraries
      working-directory: Husk
      run: bash scripts/build_ios.sh libffi glib libslirp
      if: ${{ success() && (github.event_name == 'push' || inputs.compile_app == true
        || inputs.build_ipa == true) }}
    - name: Build on-device pairing library
      working-directory: Husk
      run: bash scripts/build_rppairing_ios.sh
      if: ${{ success() && (github.event_name == 'push' || inputs.compile_app == true
        || inputs.build_ipa == true) }}
    - name: Copy iOS dependencies
      working-directory: Henge
      run: zsh ios/scripts/fetch_deps.sh
      if: ${{ success() && (github.event_name == 'push' || inputs.compile_app == true
        || inputs.build_ipa == true) }}
    - name: Restore exact iOS libzip dependency
      uses: actions/cache@v4
      with:
        path: Henge/build/ios/deps/libzip
        key: henge-ios-libzip-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id
          }}-${{ hashFiles('Henge/third_party/libzip/**', 'Henge/tools/build_ios_restore.sh')
          }}
      if: ${{ success() && (github.event_name == 'push' || inputs.compile_app == true
        || inputs.build_ipa == true) }}
    - name: Build restore stack
      working-directory: Henge
      run: zsh tools/build_ios_restore.sh
      if: ${{ success() && (github.event_name == 'push' || inputs.compile_app == true
        || inputs.build_ipa == true) }}
    - name: Build iOS engine
      working-directory: Henge
      run: make -j4 ios-lib
      if: ${{ success() && (github.event_name == 'push' || inputs.compile_app == true
        || inputs.build_ipa == true) }}
    - name: Compile and inspect iOS application without packaging
      working-directory: Henge
      if: ${{ success() && (github.event_name == 'push' || inputs.compile_app == true
        || inputs.build_ipa == true) }}
      run: zsh ios/scripts/build_app.sh
    - name: Retain failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: engine-integration-Henge-build-logs-${{ github.run_id }}
        retention-days: 3
        if-no-files-found: ignore
        path: 'Henge/ios/build/*.buildlog

          Henge/build/*.log

          Husk/build/logs/*.log

          Henge/build/scheduling-check/*.log

          '

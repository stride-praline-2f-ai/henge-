name: Henge guest GPU budget checks
'on':
  push:
    branches:
    - perf/guest-gpu-budget
    paths:
    - henge-build/probe-guest-gpu-budget.m
    - .github/workflows/henge-gpu-budget-checks.yml
permissions:
  contents: read
concurrency:
  group: henge-gpu-budget-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guest_api:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        path: request
        persist-credentials: false
    - name: Read real paravirtual Metal memory recommendation and getter ABI
      shell: bash
      run: 'set -euo pipefail

        mkdir -p probe

        cd probe

        xcodebuild -version

        xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Werror ../request/henge-build/probe-guest-gpu-budget.m
        -framework Foundation -framework Metal -framework IOKit -o probe-guest-gpu-budget

        ./probe-guest-gpu-budget

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: guest-gpu-budget-${{ github.sha }}
        path: 'probe/*.json

          probe/*.bin'
        retention-days: 14
        if-no-files-found: warn

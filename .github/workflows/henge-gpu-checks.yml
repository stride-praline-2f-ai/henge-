name: Henge focused GPU validation
'on':
  push:
    branches:
    - feature/metal4-pipeline-efficiency
    paths:
    - henge-build/**
    - .github/workflows/henge-gpu-checks.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: henge-gpu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gpu:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        path: build-request
        persist-credentials: false
    - name: Select newest installed Xcode for native touch
      run: "python3 - <<'PYSDK'\nimport glob, os, re, subprocess\nassert subprocess.check_output(['uname', '-m'],\
        \ text=True).strip() == 'arm64', 'This Henge runner requires native arm64 macOS'\ncandidates = []\nfor app\
        \ in glob.glob('/Applications/Xcode*.app'):\n    developer = app + '/Contents/Developer'\n    try:\n   \
        \     version = subprocess.check_output(['xcodebuild', '-version'], env={**os.environ, 'DEVELOPER_DIR':\
        \ developer}, text=True)\n        match = re.search(r'Xcode (\\d+(?:\\.\\d+)*)', version)\n        if match:\
        \ candidates.append((tuple(map(int, match[1].split('.'))), developer, version))\n    except subprocess.CalledProcessError:\n\
        \        pass\nif not candidates: raise SystemExit('No installed Xcode found')\n_, developer, version =\
        \ max(candidates)\nprint(version + developer)\nwith open(os.environ['GITHUB_ENV'], 'a') as f: f.write('DEVELOPER_DIR='\
        \ + developer + '\\n')\nPYSDK\n"
    - name: Load pinned inputs
      id: inputs
      run: "python3 - <<'PY'\nimport json, os\nfrom pathlib import Path\ndata = json.loads(Path('build-request/henge-build/manifest.json').read_text())\n\
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:\n    f.write('henge=' + data['henge_sha'] + '\\n')\n \
        \   f.write('husk=' + data['husk_sha'] + '\\n')\nPY\n"
    - uses: actions/checkout@v4
      with:
        repository: Leviidev/Henge
        ref: ${{ steps.inputs.outputs.henge }}
        path: Henge
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: Leviidev/Husk
        ref: ${{ steps.inputs.outputs.husk }}
        path: Husk
        persist-credentials: false
    - name: Verify and apply reviewed changes
      env:
        CUSTOM_SOURCE_COMMIT: ${{ github.sha }}
      run: "python3 - <<'PY'\nimport hashlib, json, os, plistlib, subprocess\nfrom pathlib import Path\nfolder =\
        \ Path('build-request/henge-build')\ndata = json.loads((folder / 'manifest.json').read_text())\npatch =\
        \ folder / 'henge.patch'\nassert hashlib.sha256(patch.read_bytes()).hexdigest() == data['patch_sha256']\n\
        for check in (['git', '-C', 'Henge', 'apply', '--check', str(patch.resolve())],\n              ['git', '-C',\
        \ 'Henge', 'apply', str(patch.resolve())]):\n    subprocess.run(check, check=True)\npath = Path('Henge/ios/Henge/Info.plist')\n\
        with path.open('rb') as f: info = plistlib.load(f)\ninfo['HengeCustomSourceCommit'] = os.environ['CUSTOM_SOURCE_COMMIT']\n\
        info['HengeUpstreamCommit'] = data['henge_sha']\ninfo['HengeCustomPullRequests'] = [14, 31, 32, 35, 36,\
        \ 46, 60, 61, 63, 106]\nwith path.open('wb') as f: plistlib.dump(info, f)\nif os.environ.get('HENGE_GAME_MODE')\
        \ == '1':\n    subprocess.run(['python3', 'Henge/tools/configure_gaming_experiments.py', '--info', str(path),\
        \ '--game-mode'], check=True)\n# Do not silently change normal/personal-team signing requirements.\nfor\
        \ name in ['Henge.entitlements', 'Henge.personal.entitlements']:\n    actual = Path('Henge/ios/Henge') /\
        \ name\n    expected = subprocess.check_output(['git', '-C', 'Henge', 'show', data['henge_sha'] + ':ios/Henge/'\
        \ + name])\n    assert actual.read_bytes() == expected\nPY\ngit -C Henge add -A\ngit -C Henge -c user.name='Henge\
        \ CI' -c user.email='henge-ci@users.noreply.github.com' commit -m \"Custom Henge 0.3 from ${GITHUB_SHA}\"\
        \n"
    - name: Integrate pinned Henge main and reviewed device PRs
      id: integration
      run: bash build-request/henge-build/integrate-upstream.sh
    - name: Desktop Retina window and M4 default regressions
      working-directory: Henge
      run: 'set -euo pipefail

        mkdir -p build/gpu-proof

        swiftc -parse-as-library ios/Henge/GuestScreenSize.swift tests/test_guest_screen.swift -o build/gpu-proof/test_guest_screen

        build/gpu-proof/test_guest_screen | tee build/gpu-proof/desktop-retina.log

        swiftc -parse-as-library -swift-version 5 ios/Henge/EngineTuning.swift ios/Henge/GuestScreenSize.swift ios/Henge/M4Performance.swift
        tests/test_m4_defaults.swift -o build/gpu-proof/test_m4_defaults

        build/gpu-proof/test_m4_defaults | tee build/gpu-proof/m4-defaults.log

        '
    - name: Diagnostics worker and idle touch watchdog regressions
      working-directory: Henge
      run: 'set -euo pipefail

        mkdir -p build/gpu-proof

        swiftc -parse-as-library -swift-version 5 -sanitize=address ios/Henge/NativeReportPump.swift tests/test_native_report_pump.swift
        -o build/gpu-proof/test_native_report_pump

        build/gpu-proof/test_native_report_pump | tee build/gpu-proof/native-report-pump.log

        swiftc -parse-as-library -swift-version 5 -sanitize=address ios/Henge/NativeReportPump.swift ios/Henge/SessionDiagnosticCapture.swift
        tests/test_diagnostic_capture.swift -o build/gpu-proof/test_diagnostic_capture

        build/gpu-proof/test_diagnostic_capture | tee build/gpu-proof/diagnostic-capture.log

        xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -pthread -DHV_NATIVE_TOUCH_TEST_CLOCK
        -Ihost tests/test_native_touch_watchdog.c host/native_touch.c -o build/gpu-proof/test_native_touch_watchdog

        build/gpu-proof/test_native_touch_watchdog | tee build/gpu-proof/native-touch-watchdog.log

        '
    - name: Typecheck real app on device and Simulator SDKs
      working-directory: Henge
      run: 'set -euo pipefail

        python3 tools/typecheck_app.py --sdk iphoneos

        python3 tools/typecheck_app.py --sdk iphonesimulator

        '
    - name: Desktop MetalFX geometry, routing and ownership regressions
      working-directory: Henge
      run: 'set -euo pipefail

        mkdir -p build/gpu-proof

        xcrun --sdk macosx clang -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_desktop_geometry.c
        -o build/gpu-proof/test_desktop_geometry

        build/gpu-proof/test_desktop_geometry | tee build/gpu-proof/desktop-geometry.log

        xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Werror -Wno-deprecated-declarations -fsanitize=address,undefined
        tests/test_desktop_fx.m -framework Foundation -framework Metal -weak_framework MetalFX -o build/gpu-proof/test_desktop_fx

        build/gpu-proof/test_desktop_fx | tee build/gpu-proof/desktop-fx-recording.log

        xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Werror -Wno-deprecated-declarations tests/test_desktop_fx_gpu.m
        -framework Foundation -framework Metal -weak_framework MetalFX -o build/gpu-proof/test_desktop_fx_gpu

        set +e

        build/gpu-proof/test_desktop_fx_gpu > build/gpu-proof/desktop-fx-gpu.log 2>&1

        fx_rc=$?

        set -e

        cat build/gpu-proof/desktop-fx-gpu.log

        if [[ "$fx_rc" != 0 && "$fx_rc" != 78 ]]; then exit "$fx_rc"; fi

        python3 tests/test_session_resume.py | tee build/gpu-proof/desktop-resume.log

        python3 tests/test_desktop_configuration.py | tee build/gpu-proof/desktop-configuration.log

        '
    - name: GPU state regressions and production Metal SDK checks
      working-directory: Henge
      run: "set -euo pipefail\nmkdir -p build/gpu-proof\nxcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror\
        \ -O1 -g -fsanitize=address,undefined tests/test_gpu_binding_cache.c -o build/gpu-proof/test_gpu_binding_cache\n\
        build/gpu-proof/test_gpu_binding_cache\nxcrun --sdk macosx clang -std=c11 -Wall -Wextra -Wno-unused-parameter\
        \ -Wno-deprecated-declarations -fobjc-arc -Icore -Ihost -Idevices -fsyntax-only devices/pvg_metal.m\nsdk=$(xcrun\
        \ --sdk iphoneos --show-sdk-path)\nxcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 -isysroot\
        \ \"$sdk\" -fobjc-arc -Wno-deprecated-declarations -Icore -Ihost -Idevices -fsyntax-only devices/pvg_metal.m\n\
        xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_gpu_record_support.c\
        \ -o build/gpu-proof/test_gpu_record_support\nbuild/gpu-proof/test_gpu_record_support\nxcrun --sdk macosx\
        \ clang -fobjc-arc -Wall -Wextra -Werror -Wno-deprecated-declarations -fsanitize=address,undefined tests/test_metal4_plan.m\
        \ -framework Foundation -framework Metal -o build/gpu-proof/test_metal4_plan\nbuild/gpu-proof/test_metal4_plan\n\
        xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Werror -Wno-deprecated-declarations tests/test_metal4_runtime.m\
        \ -framework Foundation -framework AppKit -framework Metal -o build/gpu-proof/test_metal4_runtime\nset +e\n\
        build/gpu-proof/test_metal4_runtime > build/gpu-proof/metal4-runtime.log 2>&1\nruntime_rc=$?\nset -e\ncat\
        \ build/gpu-proof/metal4-runtime.log\nif [[ \"$runtime_rc\" == 78 ]]; then printf 'Metal4 execution blocked\
        \ by runner GPU capability; SDK compilation remains validated\\n'; elif [[ \"$runtime_rc\" != 0 ]]; then\
        \ exit \"$runtime_rc\"; fi\nxcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Werror -Wno-deprecated-declarations\
        \ tests/test_metal4_screen.m -weak_framework MetalFX -framework Foundation -framework AppKit -framework\
        \ Metal -o build/gpu-proof/test_metal4_screen\nset +e\nbuild/gpu-proof/test_metal4_screen > build/gpu-proof/metal4-screen.log\
        \ 2>&1\nscreen_rc=$?\nset -e\ncat build/gpu-proof/metal4-screen.log\nif [[ \"$screen_rc\" != 0 && \"$screen_rc\"\
        \ != 78 ]]; then exit \"$screen_rc\"; fi\nxcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Werror -Wno-deprecated-declarations\
        \ -fsanitize=address,undefined tests/test_metal4_ordering.m -framework Foundation -framework Metal -o build/gpu-proof/test_metal4_ordering\n\
        build/gpu-proof/test_metal4_ordering\nxcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Werror -Wno-deprecated-declarations\
        \ -fsanitize=address,undefined tests/test_pipeline_bundle.m -framework Foundation -framework Metal -o build/gpu-proof/test_pipeline_bundle\n\
        build/gpu-proof/test_pipeline_bundle\nxcrun --sdk macosx clang -O2 -fobjc-arc -Wall -Wextra -Werror tests/bench_gpu_bindings.m\
        \ -framework Foundation -framework AppKit -framework Metal -o build/gpu-proof/bench_gpu_bindings\nbuild/gpu-proof/bench_gpu_bindings\
        \ | tee build/gpu-proof/binding-benchmark.log\nif ! pkg-config --exists slirp; then HOMEBREW_NO_AUTO_UPDATE=1\
        \ brew install libslirp; fi\npkg-config --cflags --libs slirp\nmake -j3 build/test_register_groups build/bench_far_chain\
        \ build/bench_snapshot_admission\nbuild/test_register_groups | tee build/gpu-proof/register-groups.log\n\
        build/bench_far_chain | tee build/gpu-proof/far-chain-benchmark.log\nbuild/bench_snapshot_admission | tee\
        \ build/gpu-proof/snapshot-admission-benchmark.log\nmake -j3 build/test_vm_lifecycle\npython3 tests/test_stats_lifecycle.py\n\
        python3 tests/test_display_pulses.py\npython3 tests/test_pacing_scheduler.py\npython3 tests/test_pipeline_bundle_plan.py\n\
        python3 - <<'PROBE'\nimport subprocess\nfrom pathlib import Path\nfor tool,args in [('metal-config',['--help']),('metal-config',['-h']),('metal-tt',['-help']),('metal-tt',['-arch','help'])]:\n\
        \ r=subprocess.run(['xcrun','-sdk','iphoneos',tool,*args],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)\n\
        \ name=tool+'-'+('-'.join(args)).replace('/','_')+'.txt'\n Path('build/gpu-proof',name).write_text(r.stdout)\n\
        \ print(tool,args,'status',r.returncode)\n print(r.stdout[:7000])\nPROBE\npython3 tools/build_pipeline_bundle.py\
        \ --out build/gpu-proof/Pipelines\ncp \"$sdk\"/System/Library/Frameworks/Metal.framework/Headers/MTL4*.h\
        \ build/gpu-proof/\nxcodebuild -version > build/gpu-proof/toolchain.txt\nprintf 'PASS GPU production SDK\
        \ and binding regressions\\n' | tee build/gpu-proof/result.txt\n"
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: gpu-proof-${{ github.run_id }}
        path: Henge/build/gpu-proof/
        retention-days: 7

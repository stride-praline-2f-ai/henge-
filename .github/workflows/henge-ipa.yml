name: Henge cloud IPA
permissions:
  contents: read
concurrency:
  group: henge-custom-ipa
  cancel-in-progress: true
env:
  HUSK: ${{ github.workspace }}/Husk
  HENGE_GAME_MODE: '0'
  HENGE_IPA_OUTPUT: ${{ github.workspace }}/Henge-output/Henge.ipa
  HENGE_CI_EMULATED_RUNNER: '0'
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  IOS_DEPS: ${{ github.workspace }}/Husk/build/ios-arm64/sysroot
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        path: build-request
        persist-credentials: false
    - name: Select newest installed Xcode for native touch
      run: "python3 - <<'PYSDK'\nimport glob, os, re, subprocess\nassert subprocess.check_output(['uname', '-m'], text=True).strip() == 'arm64', 'This Henge\
        \ runner requires native arm64 macOS'\ncandidates = []\nfor app in glob.glob('/Applications/Xcode*.app'):\n    developer = app + '/Contents/Developer'\n\
        \    try:\n        version = subprocess.check_output(['xcodebuild', '-version'], env={**os.environ, 'DEVELOPER_DIR': developer}, text=True)\n  \
        \      match = re.search(r'Xcode (\\d+(?:\\.\\d+)*)', version)\n        if match: candidates.append((tuple(map(int, match[1].split('.'))), developer,\
        \ version))\n    except subprocess.CalledProcessError:\n        pass\nif not candidates: raise SystemExit('No installed Xcode found')\n_, developer,\
        \ version = max(candidates)\nprint(version + developer)\nwith open(os.environ['GITHUB_ENV'], 'a') as f: f.write('DEVELOPER_DIR=' + developer + '\\\
        n')\nPYSDK\n"
    - name: Load pinned inputs
      id: inputs
      run: "python3 - <<'PY'\nimport json, os\nfrom pathlib import Path\ndata = json.loads(Path('build-request/henge-build/manifest.json').read_text())\n\
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:\n    f.write('henge=' + data['henge_sha'] + '\\n')\n    f.write('husk=' + data['husk_sha'] + '\\\
        n')\nPY\n"
    - uses: actions/checkout@v4
      with:
        repository: Leviidev/Henge
        ref: ${{ steps.inputs.outputs.henge }}
        path: Henge
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: Leviidev/Husk
        ref: ${{ steps.inputs.outputs.husk }}
        path: Husk
        persist-credentials: false
    - name: Verify and apply reviewed changes
      env:
        CUSTOM_SOURCE_COMMIT: ${{ github.sha }}
      run: "python3 - <<'PY'\nimport hashlib, json, os, plistlib, subprocess\nfrom pathlib import Path\nfolder = Path('build-request/henge-build')\ndata\
        \ = json.loads((folder / 'manifest.json').read_text())\npatch = folder / 'henge.patch'\nassert hashlib.sha256(patch.read_bytes()).hexdigest() ==\
        \ data['patch_sha256']\nfor check in (['git', '-C', 'Henge', 'apply', '--check', str(patch.resolve())],\n              ['git', '-C', 'Henge', 'apply',\
        \ str(patch.resolve())]):\n    subprocess.run(check, check=True)\npath = Path('Henge/ios/Henge/Info.plist')\nwith path.open('rb') as f: info = plistlib.load(f)\n\
        info['HengeCustomSourceCommit'] = os.environ['CUSTOM_SOURCE_COMMIT']\ninfo['HengeUpstreamCommit'] = data['henge_sha']\ninfo['HengeCustomPullRequests']\
        \ = [14, 31, 32, 35, 36, 46, 60, 61, 63, 106]\nwith path.open('wb') as f: plistlib.dump(info, f)\nif os.environ.get('HENGE_GAME_MODE') == '1':\n\
        \    subprocess.run(['python3', 'Henge/tools/configure_gaming_experiments.py', '--info', str(path), '--game-mode'], check=True)\n# Do not silently\
        \ change normal/personal-team signing requirements.\nfor name in ['Henge.entitlements', 'Henge.personal.entitlements']:\n    actual = Path('Henge/ios/Henge')\
        \ / name\n    expected = subprocess.check_output(['git', '-C', 'Henge', 'show', data['henge_sha'] + ':ios/Henge/' + name])\n    assert actual.read_bytes()\
        \ == expected\nPY\ngit -C Henge add -A\ngit -C Henge -c user.name='Henge CI' -c user.email='henge-ci@users.noreply.github.com' commit -m \"Custom\
        \ Henge 0.3 from ${GITHUB_SHA}\"\n"
    - name: Integrate pinned Henge main and reviewed device PRs
      run: bash build-request/henge-build/integrate-upstream.sh
    - name: Ensure Metal shader compiler
      run: "if ! xcrun --sdk macosx metal --version; then\n  xcodebuild -downloadComponent MetalToolchain\nfi\nxcrun --sdk macosx metal --version\n"
    - name: Prepare and verify build prerequisites
      run: 'set -euo pipefail

        bash build-request/henge-build/setup-runner.sh --ci

        test -d Husk/src/app/Frameworks/StikJIT.xcframework

        test -f Husk/src/rppairing-ios/Cargo.lock

        test -f Henge/third_party/libzip/CMakeLists.txt

        df -h .


        # Native networking lifecycle tests require a macOS libslirp.

        if ! pkg-config --exists slirp; then brew install libslirp; fi

        pkg-config --cflags --libs slirp

        '
    - name: Compile engine regression checks
      working-directory: Henge
      run: 'set -euo pipefail

        mkdir -p build

        exec > >(tee build/validation-00.log) 2>&1

        trap ''task_rc=$?; echo "Validation failed: exit=$task_rc line=$LINENO command=$BASH_COMMAND" >&2'' ERR

        ulimit -s 65520

        set -x

        make -j4 build/test_tlb_preload build/test_stw_flush build/test_xhci_slots build/test_inline_sysreg build/test_jit_region build/test_mmu build/test_mem
        build/test_jit build/test_devices build/test_fastmem build/test_memory_bounds build/test_tail_recheck build/test_cpu_sync build/test_timer_dispatch
        build/test_idle_integration


        make -j4 build/test_shutdown build/test_dns_lifecycle build/test_vm_lifecycle build/test_pvg_lifecycle build/test_audio_lifecycle build/test_fastmem_bench

        '
    - name: Validate JIT publication, MMU and superblocks
      working-directory: Henge
      run: 'set -euo pipefail

        mkdir -p build

        exec > >(tee build/validation-01.log) 2>&1

        trap ''task_rc=$?; echo "Validation failed: exit=$task_rc line=$LINENO command=$BASH_COMMAND" >&2'' ERR

        ulimit -s 65520

        set -x

        build/test_stw_flush


        HV_STW_IPI=1 build/test_stw_flush


        build/test_xhci_slots


        build/test_inline_sysreg


        HV_JIT_SPLIT=1 build/test_inline_sysreg


        build/test_jit_region

        HV_JIT_RELAXED_BRANCH=1 build/test_jit_region

        build/test_mmu

        HV_WALK_LOG=0 HV_IJC_PAGES=0 build/test_mmu

        build/test_jit

        HV_SUPERBLOCKS=1 build/test_jit

        HV_SUPERBLOCKS=1 HV_JIT_SPLIT=1 build/test_jit

        '
    - name: Validate memory, timing, CPU sync and devices
      working-directory: Henge
      run: 'set -euo pipefail

        mkdir -p build

        exec > >(tee build/validation-02.log) 2>&1

        trap ''task_rc=$?; echo "Validation failed: exit=$task_rc line=$LINENO command=$BASH_COMMAND" >&2'' ERR

        ulimit -s 65520

        set -x

        build/test_mem

        HV_WALK_LOG=0 HV_IJC_PAGES=0 build/test_mem

        HV_FASTMEM=1 build/test_mem

        HV_SUPERBLOCKS=1 build/test_mem

        build/test_fastmem

        build/test_memory_bounds

        build/test_tail_recheck


        HV_TLB_PRELOAD=1 build/test_mem


        HV_TLB_PRELOAD=1 build/test_tail_recheck


        build/test_tlb_preload


        HV_JIT_SPLIT=1 build/test_tlb_preload


        build/test_cpu_sync

        build/test_timer_dispatch

        build/test_idle_integration

        build/test_devices

        python3 tests/test_chain_index.py


        build/test_shutdown

        build/test_dns_lifecycle

        build/test_vm_lifecycle

        build/test_pvg_lifecycle

        build/test_audio_lifecycle

        bash tests/benchmark_fastmem.sh

        '
    - name: Validate indexes, DNS, input and Link protocol
      working-directory: Henge
      run: 'set -euo pipefail

        mkdir -p build

        exec > >(tee build/validation-03.log) 2>&1

        trap ''task_rc=$?; echo "Validation failed: exit=$task_rc line=$LINENO command=$BASH_COMMAND" >&2'' ERR

        ulimit -s 65520

        set -x

        python3 tests/test_translation_race.py

        python3 tests/test_walk_log.py

        python3 tests/test_hvsparse.py

        python3 tests/test_installer_preflight.py

        cc -std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -pthread -Itests/dns_mock -Icore -Ihost tests/test_dns_proxy.c -o build/test_dns_proxy

        build/test_dns_proxy

        swiftc ios/Henge/PhysicalMouseButtons.swift tests/test_physical_mouse_buttons.swift -o build/test_physical_mouse_buttons

        build/test_physical_mouse_buttons

        bash tools/link/check.sh

        bash tools/check_host_scheduling.sh


        # Reproduce Xcode environment while building real macOS guest samples.

        SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" make build/tl-samples.dmg

        '
    - name: Save validation output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Henge-validation-${{ github.run_id }}
        retention-days: 7
        if-no-files-found: ignore
        path: 'Henge/build/validation-*.log

          Henge/build/scheduling-check/*.log


          Henge/build/fastmem-*.log

          Henge/build/fastmem-native-summary.json

          '
    - name: Fingerprint dependency toolchain
      id: toolchain
      run: "python3 - <<'PY'\nimport hashlib, os, subprocess\ncommands = [['xcodebuild', '-version'], ['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'],\
        \ ['rustc', '-vV'], ['meson', '--version'], ['ninja', '--version'], ['pkg-config', '--version'], ['cmake', '--version'], ['xcodegen', '--version']]\n\
        identity = b'\\n'.join(subprocess.check_output(c) for c in commands)\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as f:\n    f.write('id=' + hashlib.sha256(identity).hexdigest()[:24]\
        \ + '\\n')\nPY\n"
    - name: Restore pinned dependency cache
      uses: actions/cache@v4
      with:
        path: 'Husk/third_party/build

          Husk/build/ios-arm64

          Husk/build/stamps

          '
        key: henge-cloud-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.husk }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('build-request/henge-build/fetch-required-sources.sh')
          }}
    - name: Fetch dependency sources
      working-directory: Husk
      run: bash ../build-request/henge-build/fetch-required-sources.sh "$PWD"
    - name: Build required iOS libraries
      working-directory: Husk
      run: bash scripts/build_ios.sh libffi glib libslirp
    - name: Build on-device pairing library
      working-directory: Husk
      run: bash scripts/build_rppairing_ios.sh
    - name: Copy iOS dependencies
      working-directory: Henge
      run: zsh ios/scripts/fetch_deps.sh
    - name: Build restore stack
      working-directory: Henge
      run: zsh tools/build_ios_restore.sh
    - name: Build iOS engine
      working-directory: Henge
      run: make -j4 ios-lib
    - name: Package and inspect IPA
      working-directory: Henge
      run: "zsh ios/scripts/package_ipa.sh\npython3 - <<'PY'\nimport gzip, hashlib, json, os, plistlib, subprocess, zipfile\nfrom pathlib import Path\n\
        ipa = Path(os.environ['HENGE_IPA_OUTPUT'])\nwith zipfile.ZipFile(ipa) as z:\n    assert z.testzip() is None\n    info = plistlib.loads(z.read('Payload/Henge.app/Info.plist'))\n\
        \    assert info['HengeCustomSourceCommit'] == os.environ['GITHUB_SHA']\n    assert info['HengeCustomPullRequests'] == [14, 31, 32, 35, 36, 46,\
        \ 60, 61, 63, 106]\n    manifest = json.loads(Path('../build-request/henge-build/manifest.json').read_text())\n    assert info['HengeUpstreamCommit']\
        \ == manifest['henge_sha']\n    assert info['CFBundleIdentifier'] == 'com.henge.app'\n    assert (info.get('LSSupportsGameMode') is True) == (os.environ.get('HENGE_GAME_MODE')\
        \ == '1')\n    assert info.get('HengeLinkExperimental') is True and info.get('HengeLinkProtocolVersion') == manifest['henge_link']['protocol_version']\n\
        \    assert ('Henge Link protocol ' + str(manifest['henge_link']['protocol_version'])).encode() in z.read('Payload/Henge.app/HengeLink.txt')\n \
        \   executable = z.read('Payload/Henge.app/Henge')\n    assert b'header-port=%u' in executable and b'codec canvas=' in executable\n    assert b'decode-ack-window=3'\
        \ in executable and b'decode-consumed=' in executable\n    assert '_henge-link._tcp' in info.get('NSBonjourServices', [])\n    assert b'Decoder\
        \ cannot keep up' not in executable\n    assert b'viewer controls hidden=' in executable\n    assert b'VM background execution=not implemented'\
        \ in executable\n    assert b'host-capabilities:' in executable and b'host-scheduling:' in executable\n    assert b'host-qos:' in executable and\
        \ b'A20 Pro (Duo model profile)' in executable\n    assert b'utility_requests=' in executable\n    assert b'efficiency-v3:' in executable\n    assert\
        \ b'efficiency-v2:' in executable and b'bounded IPv4/UDP/DNS parser' in executable\n    shaders = z.read('Payload/Henge.app/default.metallib')\n\
        \    assert shaders[:4] == b'MTLB' and len(shaders) > 1024\n    helper = gzip.decompress(z.read('Payload/Henge.app/henge-touch-agent.gz'))\n   \
        \ assert helper[:4] == bytes.fromhex('cffaedfe') and len(helper) > 4096\noutput = dict(game_mode_experiment=os.environ.get('HENGE_GAME_MODE') ==\
        \ '1', physical_m4_energy_verified=False, native_metal_library_sha256=hashlib.sha256(shaders).hexdigest(), native_metal_precompiled=True, source_commit=os.environ['GITHUB_SHA'],\
        \ upstream_commit=info['HengeUpstreamCommit'], patch_sha256=manifest['patch_sha256'], ipa_sha256=hashlib.sha256(ipa.read_bytes()).hexdigest(), bundle=info['CFBundleIdentifier'],\
        \ version=info['CFBundleShortVersionString'], fastmem_default=False, prs=[14,31,32,35,36,46,60,61,63,106], touch_helper_sha256=hashlib.sha256(helper).hexdigest(),\
        \ native_touch_requires_authorized_mac_signing=True, touch_launch_probe=\"Not repeated in this IPA-only build; guest HID authorization remains unverified\"\
        )\noutput['henge_link'] = dict(manifest['henge_link'], native_fix_validation='Cloud Mac protocol/credit/worker/TLS/discovery/Keychain, hardware\
        \ codec and SDK UI checks passed; not an A20 Pro thermal or performance measurement', native_checks_run=int(os.environ['GITHUB_RUN_ID']))\noutput['runner']\
        \ = manifest['runner']\noutput['duo_efficiency'] = dict(manifest['duo_efficiency'], native_validation_run=int(os.environ['GITHUB_RUN_ID']), release_binary_markers_verified=True,\
        \ physical_thermal_verified=False)\noutput['superblocks'] = dict(manifest['superblocks'], native_validation_run=int(os.environ['GITHUB_RUN_ID']),\
        \ physical_cpu_behavior_verified=False)\noutput['background_execution'] = manifest['background_execution']\noutput['efficiency_v2'] = dict(manifest['efficiency_v2'],\
        \ native_validation_run=int(os.environ['GITHUB_RUN_ID']))\n(ipa.parent / 'Henge-build-verification.json').write_text(json.dumps(output, indent=2))\n\
        PY\n"
    - name: Verify merged upstream and PRs in packaged IPA
      run: python3 build-request/henge-build/verify-integrated-ipa.py
    - uses: actions/upload-artifact@v4
      with:
        name: Henge-IPA-${{ github.sha }}
        retention-days: 14
        compression-level: 0
        if-no-files-found: error
        path: '${{ github.workspace }}/Henge-output/Henge.ipa

          ${{ github.workspace }}/Henge-output/Henge-build-verification.json

          '
    - name: Retain failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Henge-build-logs-${{ github.run_id }}
        retention-days: 3
        if-no-files-found: ignore
        path: 'Henge/ios/build/*.buildlog

          Henge/build/*.log

          Husk/build/logs/*.log

          Henge/build/scheduling-check/*.log

          '
'on':
  push:
    branches:
    - main
    paths:
    - henge-build/**
    - .github/workflows/henge-ipa.yml
  workflow_dispatch: {}

name: Cancel verified obsolete Duo builds once
'on':
  push:
    branches:
    - feature/metal4-pipeline-efficiency
    paths:
    - .github/workflows/henge-release-cleanup.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write
concurrency:
  group: henge-verified-legacy-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Cancel only four verified superseded November11 IPA build requests
      env:
        GH_TOKEN: ${{ github.token }}
      run: "python3 - <<'PY'\nimport json,os,urllib.request,urllib.error\nexpected={43097588939:'7f25d5e2ebf054b565d63506ea3f7e886a859d03',43097137150:'8f538124ea439b8cbe35de35dc58157e64918da6',43096760096:'5f2a6356790986abb98bf4c0d8fc01bde75c54bc',43096402891:'48a092baf01f4dc8c0a6c3ef4f6379091e2e2fef'}\n\
        base=os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'\nheaders={'Authorization':'Bearer\
        \ '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}\n\
        def get(run):\n    with urllib.request.urlopen(urllib.request.Request(base+str(run),headers=headers),timeout=30)\
        \ as r:return json.load(r)\nfor run,sha in expected.items():\n    item=get(run)\n    assert item['id']!=int(os.environ['GITHUB_RUN_ID'])\n\
        \    assert item['head_branch']=='feature/duo-efficiency' and item['head_sha']==sha\n    assert item['path']=='.github/workflows/henge-duo-checks.yml'\
        \ and item['event']=='push'\n    assert item['created_at']<'2026-11-12T00:00:00Z'\n    if item['status']=='completed':\n\
        \        print(json.dumps({'run':run,'action':'already_completed','conclusion':item.get('conclusion')}));continue\n\
        \    assert item['status'] in ('queued','in_progress','waiting','pending','requested')\n    try:\n     \
        \   with urllib.request.urlopen(urllib.request.Request(base+str(run)+'/cancel',data=b'',headers=headers,method='POST'),timeout=30)\
        \ as r:\n            assert r.status==202\n    except urllib.error.HTTPError as error:\n        if error.code!=409\
        \ or get(run)['status']!='completed':raise\n    print(json.dumps({'run':run,'action':'cancel_requested','only_verified_obsolete_run':True}))\n\
        PY\n"

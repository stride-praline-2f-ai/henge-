name: Henge 124 project reliability review
'on':
  push:
    branches:
    - review/build124-reliability
    paths:
    - .github/workflows/henge-review-124.yml
    - review-only/**
permissions:
  contents: read
concurrency:
  group: henge-review-124-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        path: build-request
        persist-credentials: false
    - name: Select newest installed Xcode
      run: "python3 - <<'PYSDK'\nimport glob, os, re, subprocess\ncandidates = []\nfor app in glob.glob('/Applications/Xcode*.app'):\n    developer = app + '/Contents/Developer'\n    try:\n        version = subprocess.check_output(['xcodebuild', '-version'], env={**os.environ, 'DEVELOPER_DIR': developer}, text=True)\n        match = re.search(r'Xcode (\\d+(?:\\.\\d+)*)', version)\n        if match: candidates.append((tuple(map(int, match[1].split('.'))), developer, version))\n    except subprocess.CalledProcessError:\n        pass\nif not candidates: raise SystemExit('No installed Xcode found')\n_, developer, version = max(candidates)\nprint(version + developer)\nwith open(os.environ['GITHUB_ENV'], 'a') as f: f.write('DEVELOPER_DIR=' + developer + '\\n')\nPYSDK\n"
    - id: pins
      run: "python3 - <<'PYPIN'\nimport json,os\nm=json.load(open('build-request/henge-build/manifest.json'))\nwith open(os.environ['GITHUB_OUTPUT'],'a') as f:\n    f.write('henge='+m['henge_sha']+'\\n')\n    f.write('preview='+str(m.get('ui_preview_requested',True)).lower()+'\\n')\nPYPIN"
    - uses: actions/checkout@v4
      with:
        repository: Leviidev/Henge
        ref: ${{ steps.pins.outputs.henge }}
        path: Henge
        persist-credentials: false
    - name: Reconstruct exact pinned and patched source
      run: 'set -euo pipefail

        python3 - <<''PYPATCH''

        from pathlib import Path

        import hashlib,json,subprocess

        root=Path(''build-request/henge-build'');m=json.loads((root/''manifest.json'').read_text());p=root/''henge.patch''

        assert hashlib.sha256(p.read_bytes()).hexdigest()==m[''patch_sha256'']

        subprocess.run([''git'',''-C'',''Henge'',''apply'',''--check'',str(p.resolve())],check=True)

        subprocess.run([''git'',''-C'',''Henge'',''apply'',str(p.resolve())],check=True)

        subprocess.run([''git'',''-C'',''Henge'',''add'',''-A''],check=True)

        subprocess.run([''git'',''-C'',''Henge'',''-c'',''user.name=Henge CI'',''-c'',''user.email=henge-ci@users.noreply.github.com'',''commit'',''-m'',''Apply pinned custom source for controller review''],check=True)

        PYPATCH

        bash build-request/henge-build/integrate-upstream.sh

        '
      id: reconstruct
    - name: Real Foundation filesystem and download fault cases
      working-directory: Henge
      run: |
        set -euo pipefail
        python3 ../build-request/review-only/native-review.py .
    - name: Native resume coordinator transition controls
      if: always()
      working-directory: Henge
      run: |
        set -euo pipefail
        mkdir -p build
        xcrun --sdk macosx swiftc -swift-version 5 -parse-as-library ios/Henge/ResumeCoordinator.swift ios/Henge/ResumeIdentity.swift tests/test_resume_coordinator.swift -o build/audit-resume
        build/audit-resume

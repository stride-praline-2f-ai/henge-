name: Safari replay efficiency source checks
'on':
  push:
    branches:
    - perf/safari-compositing
    - perf/replay-mapping-sync
    - test/desktop120-wireless-proof
    paths:
    - henge-build/**
    - '!henge-build/optimization-state.json'
    - .github/workflows/henge-safari-checks.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: henge-safari-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        path: build-request
        persist-credentials: false
    - name: Select newest installed Xcode
      run: "python3 - <<'PYSDK'\nimport glob, os, re, subprocess\nassert subprocess.check_output(['uname', '-m'], text=True).strip() == 'arm64', 'This Henge runner requires native arm64 macOS'\ncandidates = []\nfor app in glob.glob('/Applications/Xcode*.app'):\n    developer = app + '/Contents/Developer'\n    try:\n        version = subprocess.check_output(['xcodebuild', '-version'], env={**os.environ, 'DEVELOPER_DIR': developer}, text=True)\n        match = re.search(r'Xcode (\\d+(?:\\.\\d+)*)', version)\n        if match: candidates.append((tuple(map(int, match[1].split('.'))), developer, version))\n    except subprocess.CalledProcessError:\n        pass\nif not candidates: raise SystemExit('No installed Xcode found')\n_, developer, version = max(candidates)\nprint(version + developer)\nwith open(os.environ['GITHUB_ENV'], 'a') as f: f.write('DEVELOPER_DIR=' + developer + '\\n')\nPYSDK\n"
    - id: pins
      run: "python3 - <<'PYPIN'\nimport json,os\nm=json.load(open('build-request/henge-build/manifest.json'))\nwith open(os.environ['GITHUB_OUTPUT'],'a') as f:\n    f.write('henge='+m['henge_sha']+'\\n')\n    f.write('preview='+str(m.get('ui_preview_requested',True)).lower()+'\\n')\nPYPIN"
    - uses: actions/checkout@v4
      with:
        repository: Leviidev/Henge
        ref: ${{ steps.pins.outputs.henge }}
        path: Henge
        persist-credentials: false
    - name: Reconstruct exact pinned and patched source
      run: 'set -euo pipefail

        python3 - <<''PYPATCH''

        from pathlib import Path

        import hashlib,json,subprocess

        root=Path(''build-request/henge-build'');m=json.loads((root/''manifest.json'').read_text());p=root/''henge.patch''

        assert hashlib.sha256(p.read_bytes()).hexdigest()==m[''patch_sha256'']

        subprocess.run([''git'',''-C'',''Henge'',''apply'',''--check'',str(p.resolve())],check=True)

        subprocess.run([''git'',''-C'',''Henge'',''apply'',str(p.resolve())],check=True)

        subprocess.run([''git'',''-C'',''Henge'',''add'',''-A''],check=True)

        subprocess.run([''git'',''-C'',''Henge'',''-c'',''user.name=Henge CI'',''-c'',''user.email=henge-ci@users.noreply.github.com'',''commit'',''-m'',''Apply pinned custom source for controller review''],check=True)

        PYPATCH

        bash build-request/henge-build/integrate-upstream.sh

        '
      id: reconstruct
    - name: Checked CPU group and branch dispatch comparisons
      working-directory: Henge
      run: |
        set -euo pipefail
        mkdir -p build/safari
        exec > >(tee build/safari/cpu-cost.log) 2>&1
        make -j4 build/test_register_groups build/test_ijc_front build/bench_evict_scan build/test_mem
        build/test_register_groups
        build/test_ijc_front
        HV_JIT_SPLIT=1 build/test_ijc_front
        build/bench_evict_scan
        HV_GROUPS=0 build/test_mem
        HV_GROUPS=2 build/test_mem
      if: ${{ !cancelled() && steps.reconstruct.outcome == 'success' }}
    - name: Native replay metadata, remap and exact-surface checks
      working-directory: Henge
      run: 'set -euo pipefail

        mkdir -p build/safari

        exec > >(tee build/safari/metadata.log) 2>&1

        bash -n tests/run_lifecycle_sanitizers.sh

        python3 tests/test_gpu_page_reuse.py

        python3 tests/test_surface_sync.py

        python3 tests/test_surface_hash_limit.py

        python3 tests/test_gpu_object_cache.py

        cc -std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -Idevices tests/test_gpu_epoch.c -o build/safari/test_gpu_epoch

        build/safari/test_gpu_epoch


        cc -std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -Idevices tests/test_surface_pages.c -o build/safari/test_surface_pages

        build/safari/test_surface_pages


        python3 tests/test_gpu_command_storage.py

        HENGE_COMMAND_TSAN=1 python3 tests/test_gpu_command_storage.py

        python3 tests/test_metal4_archive_retention.py

        python3 tests/test_native_touch_mapping.py

        cc -std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -Idevices tests/test_presentation_clock.c -o build/safari/test_presentation_clock

        build/safari/test_presentation_clock

        cc -std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -Idevices tests/test_gpu_dirty_copy.c -o build/safari/test_gpu_dirty_copy

        build/safari/test_gpu_dirty_copy

        '
      if: ${{ !cancelled() && steps.reconstruct.outcome == 'success' }}
    - name: Real Metal4 bridge and pipeline state recording
      working-directory: Henge
      run: "set -euo pipefail\nmkdir -p build/safari\nexec > >(tee build/safari/real.log) 2>&1\nfor test in test_metal4_ordering test_metal4_compilation test_metal4_arguments; do\n xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Werror -Wno-deprecated-declarations -O1 -g -fsanitize=address,undefined tests/$test.m -framework Foundation -framework Metal -o build/safari/$test\n build/safari/$test\ndone\n"
      if: ${{ !cancelled() && steps.reconstruct.outcome == 'success' }}
    - name: Exact pixels and allocation ownership on host GPU
      working-directory: Henge
      run: "set -euo pipefail\nmkdir -p build/safari\nexec > >(tee build/safari/exact.log) 2>&1\nxcrun -sdk macosx metal -c devices/pvg_screen.metal -o build/safari/screen.air\nxcrun -sdk macosx metallib build/safari/screen.air -o build/safari/screen.metallib\nfor test in test_native_metal test_planar_registry; do\n xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -Idevices tests/$test.m -framework Foundation -framework Metal -framework IOSurface -o build/safari/$test\n build/safari/$test build/safari/screen.metallib\ndone\n\npython3 tests/test_surface_mapping.py\n\npython3 tests/test_surface_copy.py\n"
      if: ${{ !cancelled() && steps.reconstruct.outcome == 'success' }}
    - name: Compile real production replay for macOS and iOS
      working-directory: Henge
      run: 'set -euo pipefail

        mkdir -p build/safari

        exec > >(tee build/safari/compile.log) 2>&1

        xcrun --sdk macosx clang -std=c11 -fobjc-arc -Wall -Wextra -Wno-unused-parameter -Wno-deprecated-declarations -O2 -Icore -Ihost -Idevices -c devices/pvg_metal.m -o build/safari/pvg-macos.o

        xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 -std=c11 -fobjc-arc -Wall -Wextra -Wno-unused-parameter -Wno-deprecated-declarations -O2 -Icore -Ihost -Idevices -c devices/pvg_metal.m -o build/safari/pvg-ios.o

        '
      if: ${{ !cancelled() && steps.reconstruct.outcome == 'success' }}
    - name: Verify M4 desktop video and reconnect while mirror remains enabled
      working-directory: Henge
      run: |
        set -euo pipefail
        python3 - <<'PYWIRELESS'
        from pathlib import Path
        p=Path('tests/test_link.swift');s=p.read_text();needle='            try hardware(mode)'
        assert needle in s
        s=s.replace(needle,needle+'\n            try hardware(LinkMode(width:2560,height:1920,widthMM:260,heightMM:195,hz:60))',1);p.write_text(s)
        p=Path('tests/test_link_control_services.swift');s=p.read_text();needle='        viewer.setMirror(false)'
        assert s.count(needle)==1
        s=s.replace(needle,"""        let beforeReconnectPixels=pixels
                viewer.setForeground(false)
                await wait("video background did not disconnect") { !host.connected && !host.mirrorActive }
                viewer.setForeground(true)
                await wait("video did not reconnect automatically") { viewer.ready && viewer.videoActive && host.mirrorActive }
                precondition(host.key==pairingKey && host.port==listenerPort && test_control_displays()==0)
                test_control_frame(Unmanaged.passUnretained(texture as AnyObject).toOpaque(),Unmanaged.passUnretained(queue as AnyObject).toOpaque())
                await wait("reconnected video did not decode") { pixels>beforeReconnectPixels }
        """+needle,1).replace('test_control_video()==1','test_control_video()==2');p.write_text(s)
        PYWIRELESS
        bash tools/link/check.sh 2>&1 | tee build/safari/wireless-m4-reconnect.log
      if: ${{ !cancelled() && steps.reconstruct.outcome == 'success' }}
    - name: Focused copy and snapshot allocation comparisons
      if: ${{ !cancelled() && steps.reconstruct.outcome == 'success' }}
      working-directory: Henge
      run: 'set -euo pipefail

        mkdir -p build/safari

        exec > >(tee build/safari/copy-allocation-bench.log) 2>&1

        cc -std=c11 -Wall -Wextra -Werror -O3 -Idevices tests/bench_gpu_dirty_copy.c -o build/safari/bench_gpu_dirty_copy

        build/safari/bench_gpu_dirty_copy

        HENGE_COMMAND_BENCH=1 python3 tests/test_gpu_command_storage.py

        cc -std=c11 -Wall -Wextra -Werror -O3 -Idevices tests/bench_surface_hash.c -o build/safari/bench_surface_hash

        build/safari/bench_surface_hash

        '
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: safari-replay-checks-${{ github.sha }}
        path: Henge/build/safari/*.log
        if-no-files-found: warn
        retention-days: 7

name: Build 124 ARM64 cursor-walking comparison
'on':
  push:
    branches:
    - engine/sustained-124-pointer-measure
    paths:
    - henge-build/**
    - '!henge-build/optimization-state.json'
    - .github/workflows/henge-safari-checks.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: henge-safari-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        path: build-request
        persist-credentials: false
    - name: Select newest installed Xcode
      run: "python3 - <<'PYSDK'\nimport glob, os, re, subprocess\nassert subprocess.check_output(['uname', '-m'], text=True).strip() == 'arm64', 'This Henge runner requires native arm64 macOS'\ncandidates = []\nfor app in glob.glob('/Applications/Xcode*.app'):\n    developer = app + '/Contents/Developer'\n    try:\n        version = subprocess.check_output(['xcodebuild', '-version'], env={**os.environ, 'DEVELOPER_DIR': developer}, text=True)\n        match = re.search(r'Xcode (\\d+(?:\\.\\d+)*)', version)\n        if match: candidates.append((tuple(map(int, match[1].split('.'))), developer, version))\n    except subprocess.CalledProcessError:\n        pass\nif not candidates: raise SystemExit('No installed Xcode found')\n_, developer, version = max(candidates)\nprint(version + developer)\nwith open(os.environ['GITHUB_ENV'], 'a') as f: f.write('DEVELOPER_DIR=' + developer + '\\n')\nPYSDK\n"
    - id: pins
      run: "python3 - <<'PYPIN'\nimport json,os\nm=json.load(open('build-request/henge-build/manifest.json'))\nwith open(os.environ['GITHUB_OUTPUT'],'a') as f:\n    f.write('henge='+m['henge_sha']+'\\n')\n    f.write('preview='+str(m.get('ui_preview_requested',True)).lower()+'\\n')\nPYPIN"
    - uses: actions/checkout@v4
      with:
        repository: Leviidev/Henge
        ref: ${{ steps.pins.outputs.henge }}
        path: Henge
        persist-credentials: false
    - name: Reconstruct exact pinned and patched source
      run: 'set -euo pipefail

        python3 - <<''PYPATCH''

        from pathlib import Path

        import hashlib,json,subprocess

        root=Path(''build-request/henge-build'');m=json.loads((root/''manifest.json'').read_text());p=root/''henge.patch''

        assert hashlib.sha256(p.read_bytes()).hexdigest()==m[''patch_sha256'']

        subprocess.run([''git'',''-C'',''Henge'',''apply'',''--check'',str(p.resolve())],check=True)

        subprocess.run([''git'',''-C'',''Henge'',''apply'',str(p.resolve())],check=True)

        subprocess.run([''git'',''-C'',''Henge'',''add'',''-A''],check=True)

        subprocess.run([''git'',''-C'',''Henge'',''-c'',''user.name=Henge CI'',''-c'',''user.email=henge-ci@users.noreply.github.com'',''commit'',''-m'',''Apply pinned custom source for controller review''],check=True)

        PYPATCH

        bash build-request/henge-build/integrate-upstream.sh

        '
      id: reconstruct
    - name: Paired execution of translated ARM64 pointer walks
      working-directory: Henge
      run: |
        set -euo pipefail
        mkdir -p build/measure
        python3 - <<'PYTEST'
        from pathlib import Path
        path=Path('tests/bench_stack_groups.c')
        source=path.read_text()
        assert source.count('500000')==2
        source=source.replace('500000','24000000')
        source=source.replace('cpu.x[19]=19;', 'cpu.x[26]=cpu.x[0]=initial_sp-8192;cpu.x[19]=19;',1)
        source=source.replace('assert(!cpu.x[2]', 'assert(cpu.x[8]==0x5a5a5a5a5a5a5a5aull && cpu.x[9]==cpu.x[8] && cpu.x[10]==0x5a);\n    assert(!cpu.x[2]',1)
        path.write_text(source)
        source=Path('tests/mem_programs.S')
        words=source.read_text()
        first=words.index('Lbench_stack_groups_loop:')
        last=words.index('END bench_stack_groups',first)
        loop="""Lbench_stack_groups_loop:
            ldr x8,[x0]
            add x0,x0,#16
            ldr x9,[x0]
            sub x0,x0,#8
            ldrb w10,[x0]
            add x0,x0,#24
            sub x11,x0,x26
            and x11,x11,#0x1fe0
            add x0,x26,x11
            subs x2,x2,#1
            b.ne Lbench_stack_groups_loop
        """
        words=words[:first]+loop+words[last:]
        source.write_text(words)
        PYTEST
        make -j4 build/bench_stack_groups
        for round in 0 1 2 3 4 5 6; do
          for first in 0 1; do
            mode=$(( (round + first) % 2 ))
            printf 'fixed-origin-run mode=%d ' "$mode"
            HV_FIXED_ORIGIN_GROUPS="$mode" build/bench_stack_groups "$round"
          done
        done | tee build/measure/stack.log
        python3 - <<'PYCOST'
        from pathlib import Path
        from statistics import median
        import re
        lines=Path('build/measure/stack.log').read_text().splitlines()
        pattern=r'fixed-origin-run mode=(\d) stack-group-bench: round=(\d) writeback=1 ns_per_frame=([0-9.]+) inline_words=(\d+) result=correct'
        pairs={}
        for line in lines:
            match=re.fullmatch(pattern,line)
            assert match,line
            mode,round_,time,words=match.groups()
            pairs.setdefault(int(round_),{})[int(mode)]=(float(time),int(words))
        assert set(pairs)==set(range(7)) and all(set(pair)=={0,1} for pair in pairs.values())
        for mode in (0,1):
            print(f'fixed-origin-sustained: mode={mode} median_ns_per_frame={median(x[mode][0] for x in pairs.values()):.3f} result=correct')
        print(f'fixed-origin-sustained: lower_pairs={sum(x[1][0] < x[0][0] for x in pairs.values())}/7 scope=production-translated-synthetic-cursor-loop')
        PYCOST

name: Henge isolated APFS storage validation
'on':
  push:
    branches:
    - feature/m4-ultra-efficiency
    - review/project-038
    - feature/desktop-memory-touch
    paths:
    - henge-build/**
    - .github/workflows/henge-storage-checks.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: henge-storage-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  storage:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        path: build-request
        persist-credentials: false
    - id: pins
      run: "python3 - <<'PYPIN'\nimport json,os\nm=json.load(open('build-request/henge-build/manifest.json'))\n\
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:\n    f.write('henge='+m['henge_sha']+'\\n')\n\
        \    f.write('preview='+str(m.get('ui_preview_requested',True)).lower()+'\\n')\nPYPIN"
    - uses: actions/checkout@v4
      with:
        repository: Leviidev/Henge
        ref: ${{ steps.pins.outputs.henge }}
        path: Henge
        persist-credentials: false
    - name: Reconstruct exact pinned and patched source
      run: 'set -euo pipefail

        python3 - <<''PYPATCH''

        from pathlib import Path

        import hashlib,json,subprocess

        root=Path(''build-request/henge-build'');m=json.loads((root/''manifest.json'').read_text());p=root/''henge.patch''

        assert hashlib.sha256(p.read_bytes()).hexdigest()==m[''patch_sha256'']

        subprocess.run([''git'',''-C'',''Henge'',''apply'',''--check'',str(p.resolve())],check=True)

        subprocess.run([''git'',''-C'',''Henge'',''apply'',str(p.resolve())],check=True)

        subprocess.run([''git'',''-C'',''Henge'',''add'',''-A''],check=True)

        subprocess.run([''git'',''-C'',''Henge'',''-c'',''user.name=Henge CI'',''-c'',''user.email=henge-ci@users.noreply.github.com'',''commit'',''-m'',''Apply
        pinned custom source for controller review''],check=True)

        PYPATCH

        bash build-request/henge-build/integrate-upstream.sh

        '
    - name: Validate production disk and real APFS growth
      working-directory: Henge
      run: 'set -euo pipefail

        mkdir -p build

        exec > >(tee build/storage-integration.log) 2>&1

        python3 tests/test_disk_resize.py

        python3 tests/test_disk_recovery_macos.py

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Henge-storage-${{ github.sha }}
        path: Henge/build/storage-integration.log
        retention-days: 7
        if-no-files-found: error

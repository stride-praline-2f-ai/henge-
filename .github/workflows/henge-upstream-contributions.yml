name: Upstream contribution source checks
'on':
  push:
    branches:
    - contributions/prepare-upstream
    paths:
    - contributions/engine-memory-jit.patch
    - .github/workflows/henge-upstream-contributions.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: henge-upstream-contributions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        path: request
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: Leviidev/Henge
        ref: e98920ce3b108d17f98acaff87f74e5a477ec4b2
        path: Henge
        persist-credentials: false
    - name: Check focused engine contribution against actual upstream
      shell: bash
      run: "set -euo pipefail\n[[ \"$(uname -m)\" == arm64 ]]\nxcodebuild -version\n\
        cd Henge\ngit apply --check ../request/contributions/engine-memory-jit.patch\n\
        git apply ../request/contributions/engine-memory-jit.patch\ngit diff --check\n\
        make -j3 test-memory-jit build/test_mmu build/test_mem build/test_jit_region\
        \ build/test_jit build/test_mem_register_reference build/bench_stack_groups\
        \ build/bench_stack_groups_reference build/test_exc build/test_exc_register_reference\
        \ 2>&1 | tee engine-contribution-build.log\nfor test in test_mmu test_mem\
        \ test_jit_region test_jit test_exc test_exc_register_reference test_ijc_eviction\
        \ test_jit_retention test_branch_sites; do\n  build/$test 2>&1 | tee -a engine-contribution-tests.log\n\
        done\n\nHV_GROUPS=0 build/test_mem 2>&1 | tee -a engine-contribution-tests.log\n\
        HV_GROUPS=2 build/test_mem 2>&1 | tee -a engine-contribution-tests.log\nHV_GROUPS=2\
        \ build/test_mem_register_reference 2>&1 | tee -a engine-contribution-tests.log\n\
        for round in 0 1 2 3 4 5; do\n  if (( round % 2 )); then order=\"bench_stack_groups_reference\
        \ bench_stack_groups\"; else order=\"bench_stack_groups bench_stack_groups_reference\"\
        ; fi\n  for test in $order; do build/$test \"$round\" 2>&1 | tee -a engine-contribution-bench.log;\
        \ done\ndone\n\npython3 tests/test_chain_index.py\npython3 tests/test_translation_race.py\n"
    - name: Retain contribution test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: upstream-engine-source-checks-${{ github.sha }}
        path: Henge/*contribution*.log
        if-no-files-found: warn
        retention-days: 14

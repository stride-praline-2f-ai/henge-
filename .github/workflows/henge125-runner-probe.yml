name: Henge 125 alternate Mac capability check
on:
  push:
    branches: [ci/henge125-runner-probe]
    paths: [.github/workflows/henge125-runner-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    name: Probe ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [xcode-27-xlarge, macos-26]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 4
    steps:
      - name: Check native arm64 and installed iOS SDKs
        run: |
          uname -m
          sw_vers
          ls -d /Applications/Xcode*.app
          for app in /Applications/Xcode*.app; do
            env DEVELOPER_DIR="$app/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version || true
          done

name: Check Henge self-hosted Mac availability
on:
  push:
    branches: [ci/henge125-selfhosted-probe]
    paths: [.github/workflows/henge125-selfhosted-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, macOS, ARM64, henge]
    timeout-minutes: 4
    steps:
      - name: Check installed iOS SDKs on the configured runner
        run: |
          uname -m
          sw_vers
          for app in /Applications/Xcode*.app; do
            env DEVELOPER_DIR="$app/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version || true
          done

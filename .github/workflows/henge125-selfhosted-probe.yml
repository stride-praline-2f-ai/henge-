name: Cancel the unused Henge 125 self-hosted probe
on:
  push:
    branches: [ci/henge125-selfhosted-probe]
    paths: [.github/workflows/henge125-selfhosted-probe.yml]
permissions:
  actions: write
  contents: read
jobs:
  cancel-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel the exact earlier probe
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45186538443" --jq .head_sha)" = 37cfabdc29435593512bee13f444c9a6e6472579
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45186538443" --jq .head_branch)" = ci/henge125-selfhosted-probe
          status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45186538443" --jq .status)
          if [ "$status" != completed ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/45186538443/cancel"
          fi

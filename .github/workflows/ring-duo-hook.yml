name: Build Ring Duo app-local iPad layout hook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/ring-duo-ipad-idiom.m'
      - '.github/workflows/ring-duo-hook.yml'

permissions:
  contents: read

jobs:
  hook:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Compile unsigned iPhone arm64 dylib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios17.0 \
            -isysroot "$SDK" \
            -fobjc-arc -O2 -dynamiclib -fvisibility=hidden \
            -Wl,-install_name,@executable_path/Frameworks/RingDuoIdiom.dylib \
            -framework UIKit -framework Foundation \
            -o output/RingDuoIdiom.dylib ci/ring-duo-ipad-idiom.m
          file output/RingDuoIdiom.dylib
          xcrun otool -L output/RingDuoIdiom.dylib
          test "$(stat -f %z output/RingDuoIdiom.dylib)" -gt 1000
          shasum -a 256 output/RingDuoIdiom.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: RingDuoIdiom-unsigned-dylib
          path: output/RingDuoIdiom.dylib
          if-no-files-found: error
          retention-days: 7
